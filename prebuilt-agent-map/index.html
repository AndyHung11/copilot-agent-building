<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>Pre-built Agent 捷運路網圖 · Microsoft 365 Copilot</title>
<style>
  :root{
    --bg:#f2f4f7; --panel:#fff; --ink:#15181d; --ink2:#616b78; --line:#dfe3e9;
    --ga:#137a45; --pv:#a06a00; --fr:#4a5568;
    --spk:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4v14l-5-4H4z"/><path d="M16 9.5a4 4 0 0 1 0 5"/><path d="M18.5 7a7.5 7.5 0 0 1 0 10"/></svg>');
    --sans:"Microsoft JhengHei UI","Microsoft JhengHei","Segoe UI","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:var(--sans); background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%}
  body.locked{overflow:hidden}
  /* iOS Safari paints unstyled control text in system blue */
  button,input,select,textarea{color:inherit; -webkit-text-fill-color:currentColor}
  button{font-family:inherit}

  #cover{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    flex-direction:column; padding:24px; background:var(--bg); overflow:hidden;
    transition:opacity .35s ease}
  #cover.gone{opacity:0; pointer-events:none; visibility:hidden}
  #cover.leaving{pointer-events:none}
  .stage{position:relative; width:min(940px,100%)}
  .rails{position:absolute; left:-70vw; right:-70vw; top:91.4%; pointer-events:none}
  .rails i{display:block; height:7px; border-radius:4px; background:#c3cad3}
  .rails i+i{margin-top:9px; background:#d8dee5}
  .train{width:100%; cursor:pointer; position:relative;
    transition:transform .3s cubic-bezier(.2,.8,.3,1)}
  .train:hover{transform:translateX(8px)}
  .train svg{display:block; width:100%; height:auto; overflow:visible}

  .train .hs-body{fill:#fff}
  .train .hs-shade{fill:#e8edf3}
  .train .hs-win{fill:#dfe6ee}
  .train .hs-glass{fill:#39424f}
  .train .hs-skirt{fill:#cfd7e0}
  .cvtext{position:absolute; left:5.5%; top:43.2%; transform:translateY(-50%);
    width:50%; color:var(--ink)}
  .train .hs-quiet{opacity:.45}

  /* platform screen doors — only revealed once the announcement ends */
  .gates{position:absolute; left:-2%; right:-2%; bottom:-6%; z-index:4; pointer-events:none;
    opacity:0; transform:translateY(14%); transition:opacity .4s ease, transform .4s ease}
  .gates.on{opacity:1; transform:none}
  .gates svg{display:block; width:100%; height:auto; overflow:visible}
  /* the narrow layout stacks text under the train, so anchor the doors to the train itself */
  @media (max-width:680px){
    .gates{top:0; bottom:auto; padding-top:15.5%}
  }
  .psd-d{transition:transform .6s cubic-bezier(.4,0,.2,1)}
  .psd-d.l{transform:translateX(-105px)}
  .psd-d.r{transform:translateX(105px)}
  .gates.shut .psd-d{transform:none}
  .dest{display:inline-flex; align-items:center; gap:8px; background:#1b1f26; color:#eef3f8;
    font-size:11px; letter-spacing:.18em; padding:5px 11px; border-radius:4px; font-weight:700}
  .dest i{width:6px;height:6px;border-radius:50%;background:#ffd77a; box-shadow:0 0 7px #ffd77a}
  .cvt{font-size:clamp(21px,2.5vw,30px); font-weight:700; margin:12px 0 8px; letter-spacing:-.015em; color:#111827}
  .cvs{font-size:14px; color:#374151; line-height:1.8; margin:0}
  .scene-line{color:var(--ink2); font-style:italic}
  .cvs .scene-line{display:block; margin-top:2px; color:#4b5563}
  .cvcta{margin-top:26px; font-size:13px; color:var(--ink2); letter-spacing:.06em; text-align:center}
  /* departure */
  #cover.leaving .train{transition:transform 1.05s cubic-bezier(.5,.02,.62,.4); transform:translateX(155vw)}
  /* on narrow screens the copy sits under the train, so only the carriage pulls away */
  @media (max-width:680px){
    #cover.leaving .train{transform:none}
    #cover.leaving .train > svg{transition:transform 1.05s cubic-bezier(.5,.02,.62,.4);
      transform:translateX(155vw)}
    #cover.leaving .cvtext{opacity:0; transition:opacity .3s}
    /* hover nudges the carriage only — the copy sits outside it here */
    .train:hover{transform:none}
    .train > svg{transition:transform .3s cubic-bezier(.2,.8,.3,1)}
    .train:hover > svg{transform:translateX(8px)}
  }
  #cover.leaving .cvcta{opacity:0; transition:opacity .3s}
  #cover.leaving .speed{opacity:1}
  .speed{position:absolute; left:0; right:0; top:34%; height:32%; opacity:0; pointer-events:none;
    transition:opacity .2s .15s}
  .speed i{position:absolute; height:3px; border-radius:2px; background:linear-gradient(90deg,transparent,#aab6c4);
    animation:whoosh .5s linear infinite}
  .speed i:nth-child(1){top:12%; left:-30%; width:38%; animation-delay:.02s}
  .speed i:nth-child(2){top:42%; left:-46%; width:52%; animation-delay:.12s}
  .speed i:nth-child(3){top:72%; left:-24%; width:30%; animation-delay:.2s}
  /* percentage margin/padding resolve against the train width, keeping the lines on the carriage */
  @media (max-width:680px){
    .speed{top:0; height:0; margin-top:11.6%; padding-top:10.9%}
    .speed i{height:2px; background:linear-gradient(90deg,transparent,#c5cedb)}
    .speed i:nth-child(3){display:none}
  }
  @keyframes whoosh{from{transform:translateX(0)}to{transform:translateX(180%)}}
  .lang-float{position:fixed; top:18px; right:20px; z-index:70}
  #cover.gone .lang-float{display:none}
  .seg{display:flex; gap:2px; background:#e6eaef; border-radius:7px; padding:3px}
  .seg button{border:0;background:transparent;color:var(--ink2);padding:6px 13px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:600}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(21,24,29,.14)}

  #app{opacity:0; transition:opacity .5s ease .25s} #app.in{opacity:1}
  header{position:sticky; top:0; z-index:30; background:rgba(242,244,247,.94); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); padding:13px 22px}
  .hin{max-width:1320px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700}
  /* the artwork carries ~15% side and ~30% top/bottom transparent padding, so it is scaled up
     and cropped back; the height is set so the wordmark reads at the same size as the title */
  .brand img{content:url('Copilot-logo-horiz-c-gray-rgb 1.png'); height:46.5px; width:auto;
    clip-path:inset(33.27% 14.78% 29.48% 14.7%); margin:-15.5px -15.7px -13.7px -15.6px}
  .sep{width:1px; height:18px; background:var(--line)}
  .sw{flex:1; min-width:190px; position:relative}
  #q{width:100%; padding:9px 34px 9px 34px; border:1px solid var(--line); border-radius:7px; background:#fff;
    font-size:13.5px; outline:none; color:var(--ink)}
  #q:focus{border-color:var(--ink); box-shadow:0 0 0 3px rgba(21,24,29,.07)}
  /* the browser's own clear button ignores clicks here, so it is replaced outright */
  #q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none; appearance:none}
  .sw svg{position:absolute; left:11px; top:50%; transform:translateY(-50%)}
  .qclear{position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    border:0; border-radius:50%; background:none; padding:0; cursor:pointer; color:#616b78}
  .qclear[hidden]{display:none}
  .qclear:hover{background:#e7ebf0; color:var(--ink)}
  .qclear svg{position:static; transform:none}
  .back{border:1px solid var(--line); background:#fff; color:var(--ink2); padding:8px 14px; border-radius:7px;
    cursor:pointer; font-size:13px; font-weight:600}
  .back:hover{background:#eef1f5}
  .intro{display:flex; align-items:center; gap:18px; margin-bottom:22px}
  .intro-copy{min-width:0; flex:1; padding-top:2px}
  .intro .lede{margin-bottom:0}
  .replay-hint{margin:7px 0 0; color:#C63A12; font-size:13px; font-weight:700; line-height:1.6}
  .replay-hint .mobile{display:none}
  .announcement-fab{position:relative; flex:none; width:72px; height:72px;
    border:0; border-radius:50%; background:transparent; cursor:pointer; padding:0; overflow:hidden;
    filter:drop-shadow(0 6px 14px rgba(20,40,60,.18)); transition:transform .16s}
  .announcement-fab:hover{transform:translateY(-2px); filter:drop-shadow(0 11px 14px rgba(20,40,60,.22))}
  .announcement-fab:focus-visible{outline:3px solid rgba(15,118,110,.3); outline-offset:3px}
  .announcement-fab svg{display:block; width:100%; height:100%}

  main{max-width:1320px; margin:0 auto; padding:28px 22px 70px}
  h1{font-size:clamp(21px,2.8vw,29px); margin:0 0 9px; font-weight:700; letter-spacing:-.015em}
  .lede{margin:0 0 22px; color:var(--ink2); font-size:14.4px; line-height:1.85; max-width:82ch;
    text-wrap:pretty; word-break:keep-all; line-break:strict}
  .key{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
  .kb{border:1px solid var(--line); background:#fff; border-radius:20px; padding:7px 15px; cursor:pointer;
    font-size:13px; font-weight:600; color:var(--ink2); display:inline-flex; gap:8px; align-items:center}
  .kb i{width:14px; height:5px; border-radius:3px; background:var(--ink2)}
  .kb.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .kb.on i{background:#fff !important}
  /* 11px = .mapwrap border + padding, so the count lines up with the map itself */
  .cnt{margin-left:auto; margin-right:11px; font-size:12.5px; color:var(--ink2)}

  .mapwrap{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px;
    box-shadow:0 4px 16px rgba(21,24,29,.05); overflow:hidden}
  svg.map{display:block; width:100%; height:auto}
  /* the phone version of the network: rails run downwards */
  .vmap{display:none}
  .totop{display:none}
  .vl{--c:#616b78; margin-top:18px}
  .vl:first-child{margin-top:2px}
  .vl h3{display:flex; align-items:center; gap:9px; margin:0 0 6px; font-size:14px}
  .vl h3 .vk{width:22px; height:7px; border-radius:4px; background:var(--c); flex:none}
  .vl h3 b{color:var(--c)}
  .vl h3 .vc{margin-left:auto; font-size:11.5px; color:var(--ink2);
    font-variant-numeric:tabular-nums}
  .vl ul{list-style:none; margin:0; padding:0; position:relative}
  .vl ul::before{content:''; position:absolute; left:17.5px; top:20px; bottom:20px;
    width:5px; border-radius:3px; background:var(--c); opacity:.92}
  .vst{display:flex; align-items:center; gap:11px; padding:5px 4px; cursor:pointer;
    border-radius:10px; position:relative; transition:background .16s}
  .vst:active{background:#eef2f6}
  .vst .vm{flex:none; display:block}
  .vst .vt{flex:1; min-width:0}
  .vst .vt b{display:block; font-size:13.6px; line-height:1.45}
  .vst .vt i{display:block; font-style:normal; font-size:11.8px; line-height:1.5;
    color:var(--ink2); margin-top:1px}
  .vst .vgo{flex:none; color:#b6bfc9}
  .vst.dim{opacity:.34}
  .mapwrap.searching .vst.dim{display:none}
  .mapwrap.searching .vl ul::before{opacity:.16}
  .mapwrap.searching .vl h3{opacity:.35}
  @media (max-width:680px){
    .mapwrap{overflow:visible; padding:12px 12px 14px}
    .cnt{margin-right:13px}
    svg.map{display:none}
    .vmap{display:block}
    .totop{position:fixed; left:50%; right:auto; bottom:12px; transform:translateX(-50%); z-index:30; display:inline-flex; align-items:center;
      gap:6px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px;
      padding:10px 15px; font-size:12.6px; font-weight:700; cursor:pointer;
      box-shadow:0 10px 24px rgba(20,30,45,.16)}
    .totop[hidden],body.locked .totop{display:none}
  }
  .stop{cursor:pointer}
  .stop .hit{fill:transparent}
  .stop .dot,.stop .ring{transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .dot,.stop:hover .ring{transform:scale(1.22)}
  .stop .lbl{font-family:var(--sans); font-size:12.5px; font-weight:700; fill:var(--ink);
    transition:transform .16s ease, fill .16s ease; transform-origin:center; transform-box:fill-box}
  .stop .sub{font-family:var(--sans); font-size:10px; fill:var(--ink2);
    transition:transform .16s ease; transform-origin:center; transform-box:fill-box}
  .stop:hover .lbl{fill:#000; transform:scale(1.22)}
  .stop:hover .sub{transform:scale(1.22)}
  .stop.lg .lbl{font-size:15px; font-weight:800}
  .stop.lg .sub{font-size:11.4px}
  .stop.lg .dot,.stop.lg .ring{transform:scale(1.16)}
  .stop.sm .lbl{font-size:10.6px}
  .stop.sm .sub{font-size:8.8px}
  .linelabel{font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:.03em}
  .linecount{font-family:var(--sans); font-size:10.5px; fill:var(--ink2)}
  .dim{opacity:.14; transition:opacity .22s}
  .mapwrap.searching .stop.dim{opacity:0; pointer-events:none}
  .mapwrap.searching .route-track{opacity:.14}
  .mapwrap.searching .route-halo{opacity:.35}
  .mapwrap.searching .route-legend{opacity:.35}
  .mkey{display:flex; gap:18px; flex-wrap:wrap; align-items:center; margin:14px 2px 0;
    font-size:12.4px; color:var(--ink2)}
  .mkey span{display:inline-flex; align-items:center; gap:7px}
  .mkey svg{flex:none}
  .nores{margin:30px auto 10px; max-width:520px; text-align:center; color:var(--ink2); font-size:13.4px}
  .nores b{display:block; color:var(--ink); font-size:15px; margin-bottom:7px}
  .nores .sg{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:13px}
  .nores .sg button{border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:7px 13px; font-size:12.6px; cursor:pointer}
  .nores .sg button:hover{background:#eef1f5}
  .nores .clear{margin-top:16px; border:0; background:none; padding:2px 0; cursor:pointer;
    font:inherit; font-size:12.4px; color:var(--ink2); text-decoration:underline}
  .nores .clear:hover{color:var(--ink)}
  /* the search matches what an agent is for, not just its name — the chips are
     the only place that says so before anything has been typed */
  .qtips{position:absolute; top:calc(100% + 7px); left:0; right:0; z-index:5;
    display:flex; flex-wrap:wrap; align-items:center; gap:7px;
    background:#fff; border:1px solid var(--line); border-radius:9px; padding:10px 12px;
    box-shadow:0 12px 26px rgba(20,40,60,.15)}
  .qtips[hidden]{display:none}
  .qtips .qt-lbl{flex-basis:100%; font-size:12px; color:var(--ink2)}
  .qtips button{border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:4px 12px; font:inherit; font-size:12.6px; color:var(--ink); cursor:pointer;
    transition:background .15s, border-color .15s}
  .qtips button:hover{background:#eef1f5; border-color:#c7d0da}
  .mapwrap.empty svg.map,.mapwrap.empty .vmap{display:none}

  footer{max-width:1320px; margin:0 auto; padding:24px 22px 96px; color:var(--ink2); font-size:12.4px; line-height:1.85}
  /* ~15% side and ~33% top/bottom of this file is transparent padding, cropped so the mark sits flush */
  .msmark{display:block; height:53.8px; width:auto;
    clip-path:inset(33.22% 14.99% 33.33% 14.89%); margin:-17.9px -18px -6px -17.9px}
  footer .footh{display:block; font-weight:700; color:var(--ink); margin-bottom:4px}

  .ov{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(21,24,29,.44); backdrop-filter:blur(5px);
    padding:max(44px, env(safe-area-inset-top)) 40px max(44px, env(safe-area-inset-bottom))}
  .ov.open{display:flex}
  .card{width:min(840px,100%); max-height:min(82vh, 880px); overflow:auto; background:#fff; border-radius:12px;
    box-shadow:0 30px 72px rgba(21,24,29,.3); position:relative; animation:up .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{opacity:0; transform:translateY(16px)}to{opacity:1;transform:none}}
  .card.swap{animation:fd .26s ease} @keyframes fd{from{opacity:.4}to{opacity:1}}
  .c-bar{height:7px; border-radius:12px 12px 0 0}
  .c-head{padding:26px 32px 22px; border-bottom:1px solid var(--line)}
  .c-line{display:flex; align-items:center; gap:9px; font-size:12px; font-weight:700; letter-spacing:.06em}
  .c-line i{width:16px; height:5px; border-radius:3px}
  .c-head h2{margin:11px 0 3px; font-size:25px; font-weight:700; letter-spacing:-.01em}
  .c-alt{font-size:12.5px; color:var(--ink2); letter-spacing:.03em}
  .c-tags{display:flex; gap:8px; margin:13px 0 11px; flex-wrap:wrap; align-items:center}
  .pill{font-size:10.5px; font-weight:800; letter-spacing:.1em; padding:4px 10px; border-radius:4px}
  .pill.ga{background:#e3f2e9; color:var(--ga)} .pill.preview{background:#fbf0d8; color:var(--pv)}
  .pill.frontier{background:#e9ecf1; color:var(--fr)}
  .kind{font-size:12px; color:var(--ink2); border:1px solid var(--line); padding:3px 9px; border-radius:4px}
  .c-tag{margin:0; font-size:14.4px; color:#333a44; line-height:1.7}
  .c-act{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:8px; border:0; cursor:pointer; text-decoration:none;
    padding:10px 20px; border-radius:7px; font-size:13.6px; font-weight:700; transition:filter .15s, transform .15s}
  .btn:hover{filter:brightness(1.07); transform:translateY(-1px)}
  .btn.solid{background:var(--ink); color:#fff}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
  .c-body.one{display:block; padding:22px 32px 26px}
  .c-body{display:grid; grid-template-columns:1fr 1fr}
  .c-col{padding:24px 32px 30px} .c-col + .c-col{border-left:1px solid var(--line)}
  h4{margin:0 0 10px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2); font-weight:800}
  h4.mt{margin-top:22px}
  .c-col ul{margin:0;padding-left:18px} .c-col li{margin:6px 0; font-size:14px; line-height:1.7}
  .c-col p{margin:0; font-size:14px; line-height:1.75; color:#333a44}
  .quote{margin-top:15px; padding:12px 15px; background:#f4f6f9; border-left:3px solid var(--ink);
    border-radius:0 6px 6px 0; font-size:13.6px; line-height:1.75}
  .pr{display:flex; gap:10px; justify-content:space-between; align-items:flex-start; border:1px solid var(--line);
    border-radius:7px; padding:10px 12px; margin-bottom:7px}
  .pr span{font-size:13.3px; line-height:1.65}
  .cp{border:1px solid var(--line); background:#fff; border-radius:5px; padding:4px 10px; font-size:11.5px;
    cursor:pointer; white-space:nowrap; font-weight:700}
  .cp:hover{background:#eef1f5}
  .c-foot{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 32px 22px;
    border-top:1px solid var(--line); font-size:12.6px; color:var(--ink2)}
  .c-foot button{border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 14px;
    cursor:pointer; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:5px}
  .c-foot .nav-prev .nav-arrow{order:-1}
  .c-foot button:disabled{opacity:.34; cursor:default}
  .c-foot .c-pos{display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center}
  .c-keys{font-style:normal; font-size:11px; color:#8b95a1}
  .x{position:absolute; top:16px; right:18px; border:0; background:#eef1f5; width:31px; height:31px;
    border-radius:6px; cursor:pointer; font-size:15px; line-height:1; z-index:3}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); opacity:0; pointer-events:none;
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:7px; font-size:13px; z-index:80;
    transition:opacity .2s, transform .2s}
  .toast.show{opacity:1; transform:translate(-50%,0)}
  .guide{position:fixed; inset:0; z-index:90; display:none; overflow:auto;
    background:rgba(21,24,29,.58); backdrop-filter:blur(6px)}
  .guide.open{display:block}
  .guide .guide-pa{position:absolute; left:var(--announcement-left,24px);
    top:var(--announcement-top,24px);
    width:min(1126px,calc(100vw - var(--announcement-left,24px) - 24px)); max-width:none;
    align-items:flex-start; margin:0}
  .guide .guide-pa::after{content:""; position:absolute; left:77px; top:14px; width:16px; height:16px;
    background:#fff; border-left:1px solid var(--line); border-top:1px solid var(--line);
    transform:rotate(-45deg); border-radius:3px 0 0 0; z-index:2}
  .guide .guide-pa>.pa-spk{width:72px; height:72px}
  .guide-panel{width:min(1040px,100%); height:min(647px,calc(100vh - 48px)); overflow:hidden; background:#fff;

    #onboard.spotting:not(.walking) .obrow:not(.on):not(.out){display:none}
    #onboard.spotting:not(.walking) .pa-say p{font-size:13.2px; line-height:1.7}
    #onboard.spotting:not(.walking) .pa-bub{padding:13px 14px 11px; border-radius:12px}
  }
  @media (prefers-reduced-motion:reduce){
    #spot,#spot i,#onboard .pa{transition:none}
    #spot::after{animation:none}
    #spot b.tap{animation:none}
  }

</style>

var AGENTS = [{"id": "idea-coach", "name": "Idea Coach", "color": "#8a4992", "icon": "bulb", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_be483bea-dc19-b6ae-1d69-fde1f2c7b661&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "點子教練", "tagline": "帶著你規劃並走完腦力激盪的過程。", "lead": "像一位隨身的腦力激盪夥伴，用輕鬆、協作的語氣激發創意，並協助你規劃與推進整個發想過程，讓討論保持聚焦、不偏離主題。設計上搭配 Microsoft 365 Copilot 使用。", "can": ["規劃一場腦力激盪要怎麼進行", "一次問一題，把想法逐層引導出來", "讓討論保持聚焦，偏題時拉回來", "用輕鬆、協作的語氣帶動想法"], "who": "要辦活動、想企劃、做創新提案、帶工作坊的人。", "prompts": ["我要在部門推廣 Copilot，幫我規劃一場腦力激盪要怎麼進行。", "我們的討論越來越發散，幫我拉回主題。", "針對這個主題，一次問我一個問題，帶我把想法想清楚。"], "status": "Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Plan and navigate the brainstorming process.", "lead": "A personal brainstorming companion that inspires creativity with a fun, collaborative tone. It helps you plan and navigate the brainstorming process, and makes sure you stay focused and on track. Designed to work with Microsoft 365 Copilot.", "can": ["Plan how a brainstorm should run", "Draw ideas out by asking one question at a time", "Keep the discussion focused, and pull it back when it drifts", "Set a fun, collaborative tone"], "who": "Anyone planning an event, campaign, innovation pitch or workshop.", "prompts": ["I want to promote Copilot in my department — help me plan the brainstorm.", "Our ideas are drifting. Bring the discussion back to the topic.", "Ask me one question at a time and help me think this through."], "sub": "Idea Coach", "status": "Agent", "product": "Microsoft 365 Copilot"}, "n": 1, "file": "MS-01", "domain": "free", "stop": 0, "prop": "bulb"}, {"id": "word-agent", "name": "Word Agent", "color": "#2b579a", "icon": "doc", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_15f67c5b-bfb1-fbd9-043a-cbb047bb7bd0", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "Word 文件生成", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "描述你要的文件，直接產出一份 Word 檔。", "lead": "Word Agent 讓你用一句話描述需求，就生成完整的 Word 文件草稿 —— 不需要排版或設計技巧。你可以用「再短一點」「多加一段」這類高層次回饋直接修改，也能在 Word 中繼續編修。它會依你原本的權限自動引用檔案、郵件、聊天與會議內容。由 Microsoft 直接安裝，會出現在 Copilot 的「工具」與左側 Agent 清單，需要 Microsoft 365 Copilot 授權；產出的檔案會存到你的 OneDrive。", "can": ["從一段描述生成完整的 Word 文件草稿", "用「再短一點」「加一節」等回饋直接改稿", "引用你有權限的檔案、郵件、會議內容充實內容", "完成的檔案自動存到 OneDrive，可直接用 Word 開啟續編"], "who": "要寫提案、報告、指南、公告等長文件，又不想從空白頁開始的人。", "prompts": ["幫我做一份 2 頁的專案提案，包含前言、問題描述、解決方案與時程。", "撰寫一份 5 頁的新人上手指南，涵蓋公司簡介、規章、職務訓練與常見問題，語氣親切好讀。", "用 Q3_sales.xlsx 的資料，整理成一份含圖表的摘要報告。"]}, "en": {"sub": "Word Agent", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Describe the document you need — get a Word file back.", "lead": "Word Agent creates a full Word document from a plain description, with no formatting or design skills needed. Refine the draft with high-level feedback like “make it shorter” or “add a section”, or keep editing in Word. It pulls in your files, emails, chats and meetings under your existing permissions. Installed by Microsoft and shown in the Tools menu and agent list; a Microsoft 365 Copilot licence is required. Generated files are saved to your OneDrive.", "can": ["Generate a complete Word draft from one prompt", "Refine with high-level feedback such as “make it shorter”", "Ground the draft in files, emails and meetings you can already access", "Save the finished file to OneDrive and keep editing in Word"], "who": "Anyone writing proposals, reports, guides or announcements who would rather not start from a blank page.", "prompts": ["Create a 2-page project proposal with an introduction, problem statement, solution overview, and timeline.", "Draft a 5-page employee onboarding guide with company overview, policies, role-specific training and FAQs. Use a friendly, informative tone.", "Use data from Q3_sales.xlsx to create a summary report with charts."]}, "n": 2, "file": "MS-02", "prop": "doc"}, {"id": "excel-agent", "name": "Excel Agent", "color": "#1c7a4a", "icon": "grid", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8d830dc1-9a14-1528-1182-c8e3be94cf5a", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "試算表生成", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "用一句話描述，就生成一份可以直接用的活頁簿。", "lead": "Excel Agent 讓你不必打開 Excel，就能用自然語言建立活頁簿。描述你要什麼——預算追蹤表、專案計畫或財務模型——它就把結構搭好：建立分頁、整理資料，並寫好可以運作的公式，拿到就能開始用。", "can": ["用自然語言描述就建立活頁簿", "建立分頁並整理資料結構", "寫好可以直接運作的公式", "預算追蹤、專案計畫、財務模型都適用", "在 Excel 之外完成，不用從空白活頁簿開始"], "who": "常要做預算表、專案計畫或財務模型，但不想自己手刻結構與公式的人。", "prompts": ["建立一份預算追蹤表，每月一個分頁。", "幫我做一份專案計畫的活頁簿，包含時程與負責人。", "建立一個簡單的財務模型，含收入、成本與利潤試算。"]}, "en": {"sub": "Excel Agent", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Create an Excel workbook using just your words.", "lead": "The Excel agent gives you a natural-language way of creating workbooks outside of Excel. Describe what you need — a budget tracker, a project plan or a financial model — and it builds the structure for you: it sets up the sheets, organises the data and creates working formulas so you can start working immediately.", "can": ["Create a workbook from a plain-language description", "Set up the sheets and organise the data", "Write working formulas, ready to use", "Budget trackers, project plans, financial models", "Done outside Excel — no blank workbook to start from"], "who": "Anyone building budgets, project plans or financial models who would rather skip the structure and formula work.", "prompts": ["Set up a budget tracker with a sheet for each month.", "Build me a project plan workbook with the timeline and owners.", "Create a simple financial model with revenue, costs and profit."]}, "n": 3, "file": "MS-03", "prop": "grid"}, {"id": "powerpoint-agent", "name": "PowerPoint Agent", "color": "#c43e1c", "icon": "slides", "status": "ga", "domain": "free", "url": "https://m365.cloud.microsoft/chat/?titleId=P_54c3f25e-3850-e1e6-231a-aa85fbe9447b", "docs": "https://support.microsoft.com/en-us/office/365-copilot-app/get-started-with-word-excel-and-powerpoint-agents-in-microsoft-365-copilot", "zh": {"sub": "簡報生成", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "說出主題與頁數，直接生成一份簡報。", "lead": "PowerPoint Agent 依你的描述產生整份簡報，含版面與設計，不必自己排版。生成後可以用「加一張投影片」「換個風格」這類回饋調整，也能在 PowerPoint 裡繼續修。它會自動引用你有權限的工作內容。由 Microsoft 直接安裝，會出現在 Copilot 的「工具」與左側 Agent 清單，需要 Microsoft 365 Copilot 授權；產出的檔案會存到你的 OneDrive。", "can": ["依主題與張數生成完整簡報", "用「加一張投影片」等回饋直接調整", "引用你有權限的檔案與資料充實內容", "完成的簡報存到 OneDrive，可用 PowerPoint 續編"], "who": "要在短時間內生出一份像樣的簡報，或缺少設計時間的人。", "prompts": ["做一份 10 頁的行銷策略簡報，風格現代簡潔。", "建立一份 10 張投影片的行銷策略簡報，包含前言、分析、建議與結論。", "把這份提案文件改成 8 頁的主管簡報，每頁重點不超過三行。"]}, "en": {"sub": "PowerPoint Agent", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Name the topic and the length — get a deck.", "lead": "PowerPoint Agent builds a complete presentation from your description, layout and design included. Adjust it with feedback such as “add a slide”, or keep polishing in PowerPoint. It draws on the work content you already have access to. Installed by Microsoft and shown in the Tools menu and agent list; a Microsoft 365 Copilot licence is required. Generated files are saved to your OneDrive.", "can": ["Build a full deck from a topic and a slide count", "Adjust with feedback such as “add a slide”", "Ground slides in files and data you can already access", "Save to OneDrive and finish in PowerPoint"], "who": "Anyone who needs a presentable deck fast, or has no time for design.", "prompts": ["Build a 10-slide marketing strategy presentation with a modern design.", "Build a 10-slide marketing strategy deck with introduction, analysis, recommendations, and conclusion.", "Turn this proposal into an 8-slide executive deck, three bullets per slide maximum."]}, "n": 4, "file": "MS-04", "prop": "slides"}, {"id": "ai-learning-advisor", "name": "AI Learning Advisor", "color": "#9a423c", "icon": "compass", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8c75de5c-bfa0-68eb-5528-89a1c35a90b7&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-ai-learning-advisor", "zh": {"sub": "AI 學習顧問", "tagline": "教你用 Agent Builder、Copilot Studio 與 Power Platform，也幫你排錯。", "lead": "教你上手並排解 Microsoft 的 AI 與低程式碼技術，涵蓋 Microsoft 365 Copilot Agent Builder、Copilot Studio 與 Power Platform（Power Apps、Power Automate、AI Builder、Dataverse）。它用白話解釋概念、規劃個人化學習計畫、依情境推薦該用哪個工具、給出逐步的建置指引，並協助排解錯誤與行為異常的 Agent、主題或流程。內容以 Microsoft Learn 為依據；不處理授權、定價、法務或租戶專屬資料。", "can": ["用白話解釋 AI 與低程式碼概念", "規劃個人化的學習計畫", "依情境推薦該用哪個工具", "給出逐步的建置指引", "排解錯誤與行為異常的 Agent、主題或流程"], "who": "想導入 Copilot／Power Platform 但不知從何開始的人，以及要帶團隊上手的推廣者。", "prompts": ["我沒接觸過 Copilot Studio，幫我規劃四週的入門學習計畫。", "我建的 Agent 一直抓不到知識來源，幫我找出可能的原因。", "我想自動彙整週報，該用 Agent Builder、Copilot Studio 還是 Power Automate？"], "status": "Agent", "product": "Copilot Studio / Microsoft Learn"}, "en": {"tagline": "Teaches and troubleshoots Copilot Agent Builder, Copilot Studio and Power Platform.", "lead": "Teaches and troubleshoots Microsoft’s AI and low-code stack — Microsoft 365 Copilot Agent Builder, Copilot Studio and Power Platform (Power Apps, Power Automate, AI Builder, Dataverse). It explains concepts in plain language, builds personalised learning plans, recommends the right tool for the job, gives step-by-step build guides, and troubleshoots errors and misbehaving agents, topics and flows. Grounded in Microsoft Learn; it does not handle licensing, pricing, legal or tenant-specific data.", "can": ["Explain AI and low-code concepts plainly", "Build a personalised learning plan", "Recommend the right tool for the job", "Give step-by-step build guides", "Troubleshoot errors and misbehaving agents, topics and flows"], "who": "Anyone starting with Copilot or Power Platform, and those enabling a team.", "prompts": ["I’ve never used Copilot Studio — plan me a four-week path.", "My agent isn’t picking up its knowledge source — help me debug it.", "To automate a weekly report, should I use Agent Builder, Copilot Studio or Power Automate?"], "sub": "AI Learning Advisor", "status": "Agent", "product": "Copilot Studio / Microsoft Learn"}, "n": 5, "file": "MS-05", "domain": "grow", "stop": 0, "prop": "compass"}, {"id": "learning", "name": "Learning", "color": "#4c7637", "icon": "cap", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_ad3f22f7-c966-2226-0625-5498e4ef2f73&source=agentCenterDialog", "docs": "", "zh": {"sub": "學習", "tagline": "個人化的學習推薦與技能發展。", "lead": "提供個人化的學習推薦與技能發展建議，協助你依照自己的角色與目標持續累積能力。", "can": ["依你的角色推薦合適的學習內容", "協助規劃技能發展方向", "把學習與工作目標連結起來", "追蹤學習進度"], "who": "想持續進修的員工，以及負責規劃學習發展的人資與主管。", "prompts": ["依我的角色，推薦接下來三個月值得投入的學習主題。", "幫我把學習排進每週固定的節奏，並避開我的會議。", "我想強化資料分析能力，給我一條由淺到深的學習路徑。"], "status": "Agent", "product": "Microsoft Viva Learning"}, "en": {"tagline": "Personalised learning recommendations and skill growth.", "lead": "Offers personalised learning recommendations and skill development guidance, so you can keep building capability around your role and goals.", "can": ["Recommend learning suited to your role", "Help shape a skill development direction", "Connect learning to your work goals", "Track how you are progressing"], "who": "Employees investing in their own growth, plus HR and managers planning development.", "prompts": ["Given my role, what should I learn over the next three months?", "Fit my learning into a weekly rhythm that avoids my meetings.", "I want to strengthen data analysis — give me a path from the basics up."], "sub": "Learning", "status": "Agent", "product": "Microsoft Viva Learning"}, "n": 6, "file": "MS-06", "domain": "grow", "stop": 2, "prop": "book"}, {"id": "prompt-coach", "name": "Prompt Coach", "color": "#5a6fa8", "icon": "chat", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_f0ff38f1-4d81-a9b7-dbf1-b161328daa1f", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "提示教練", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "寫出提示，也把既有的提示改得更好。", "lead": "協助你寫出結構清楚、真正有效的提示。它既能依你的目標直接產生新的提示，也能分析你手上現有的提示，確認是否對得上目標；過程中會給你回饋、範例與可以直接動手的改進建議。設計上搭配 Microsoft 365 Copilot 使用。", "can": ["依你的目標直接產生新的提示", "分析既有提示，檢查是否對得上目標", "用範例說明好提示與不好提示的差別", "給出可以直接動手的改進建議"], "who": "剛開始用 Copilot、或覺得「AI 回答得不夠好」的人 —— 這是最好的第一站。", "prompts": ["我想請 Copilot 整理會議紀錄，但結果都太籠統，幫我改寫成更好的提示。", "教我一個寫提示的通用結構，並用我的工作情境示範一次。", "我要為季度回顧做一份摘要，直接幫我寫一個提示。"]}, "en": {"sub": "Prompt Coach", "status": "Agent", "product": "Microsoft 365 Copilot", "tagline": "Write and improve your prompts.", "lead": "Helps you craft well-structured, effective prompts. It both generates new prompts from your goal and analyses the ones you already have, checking they line up with what you want — offering feedback, examples and actionable suggestions along the way. Designed to work with Microsoft 365 Copilot.", "can": ["Generate a new prompt from your goal", "Analyse an existing prompt against what you want", "Show, with examples, what separates a weak prompt from a strong one", "Give actionable suggestions you can apply straight away"], "who": "Anyone new to Copilot, or anyone who feels the answers are not good enough yet.", "prompts": ["My meeting-notes prompts keep giving vague results — rewrite this into a better prompt.", "Teach me a general structure for writing prompts and demo it on my job.", "I need a summary for our quarterly review — write me the prompt."]}, "domain": "grow", "n": 7, "file": "MS-07", "prop": "star"}, {"id": "writing-coach", "name": "Writing Coach", "color": "#92497c", "icon": "pen", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_e3d64609-7a28-6de6-3093-402c20bb96ce&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "寫作教練", "tagline": "給出具體回饋，把每一種寫作都寫得更好。", "lead": "專門提供詳細且有建設性回饋的寫作助理。不論是修一封 Email、寫一則故事，還是發展一份白皮書，都會一路陪你改到好，並說明為什麼這樣改更好。設計上搭配 Microsoft 365 Copilot 使用。", "can": ["針對任何寫作任務給出詳細回饋", "指出問題在哪裡，並說明可以怎麼改", "從 Email、故事到白皮書都適用", "一路陪你改到完成"], "who": "所有需要把文字寫好的人，從日常郵件到長篇文件。", "prompts": ["幫我看這封給客戶的信：語氣恰當嗎？哪裡可以更精簡？", "這段內容太冗長，幫我改寫成更精簡的版本。", "我在寫一份白皮書，幫我看開頭這一段的結構夠不夠清楚。"], "status": "Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Detailed feedback that lifts any piece of writing.", "lead": "An expert assistant dedicated to detailed, constructive feedback. Whether you are refining an email, crafting a story or developing a whitepaper, it guides you every step of the way and explains why each change is an improvement. Designed to work with Microsoft 365 Copilot.", "can": ["Give detailed feedback on any writing task", "Point out what is not working, and how to fix it", "Works for email, stories and whitepapers alike", "Guides you step by step to the finished piece"], "who": "Anyone whose writing needs to land — from everyday email to long-form documents.", "prompts": ["Review this customer email — right tone? Where can it be tighter?", "This passage is too long — rewrite it more concisely.", "I am drafting a whitepaper — is the structure of this opening clear enough?"], "sub": "Writing Coach", "status": "Agent", "product": "Microsoft 365 Copilot"}, "n": 8, "file": "MS-08", "domain": "grow", "stop": 1, "prop": "pen"}, {"id": "career-coach", "name": "Career Coach", "color": "#92495f", "icon": "path", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_fcaaab0f-7062-e237-7557-77b846a22444&source=agentCenterDialog", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/agents-built-by-microsoft", "zh": {"sub": "職涯教練", "tagline": "在現在的角色上持續進步，把技能落差補起來。", "lead": "陪你走過職涯的每一步：想在現在的角色上更進一步、想探索新的可能，或想補起技能落差，都能依你自己的經歷與路徑，給出個人化且可以立刻執行的建議。設計上搭配 Microsoft 365 Copilot 使用。", "can": ["找出技能落差並排出補強順序", "給出可以立刻執行的具體建議", "規劃在現有角色上進一步的做法", "依你的經歷量身調整，不給通則"], "who": "想把現在的工作做得更好、或想有系統地補強技能的工作者。", "prompts": ["依我現在的角色，列出我最該補強的技能並排優先順序。", "我想在一年內承擔更大的專案責任，我還缺什麼？", "我要跟主管談發展方向，幫我準備談話重點。"], "status": "Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Grow in the role you are in, and close your skill gaps.", "lead": "Guides you through every step of your professional journey — advancing in your current role, exploring new opportunities, or bridging skill gaps — with personalised, actionable advice tailored to your own path. Designed to work with Microsoft 365 Copilot.", "can": ["Spot skill gaps and put them in order", "Give advice you can act on immediately", "Map how to go further in your current role", "Tailored to your path, not generic guidance"], "who": "Anyone who wants to do their current job better, or close skill gaps methodically.", "prompts": ["For the role I am in now, rank the skills I should strengthen first.", "I want to take on bigger project responsibility within a year — what am I missing?", "I am talking to my manager about my development — help me prepare."], "sub": "Career Coach", "status": "Agent", "product": "Microsoft 365 Copilot"}, "n": 9, "file": "MS-09", "domain": "grow", "stop": 2, "prop": "ladder"}, {"id": "sme-finder", "name": "SME Finder", "color": "#9a683c", "icon": "search", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_a8f2ed7d-faf1-5ad5-e4bc-dbd09bf80ed8&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-sme-finder", "zh": {"sub": "專家搜尋", "tagline": "找出公司裡最可信的內部專家，並附上佐證。", "lead": "針對任何主題、產品、流程或客戶，找出公司裡最可信的內部專家。它會給出首選人選與備選，並附上來自 SharePoint、Teams、Outlook、行事曆與組織資料的佐證，還附一封可以直接寄出的 Email 或 Teams 訊息。也能找出非主管職的隱藏高手、辨識應用程式或網站的擁有者、比較兩位專家該先找誰、擬定會前談話重點，以及尋找導師。不處理人資、法務、併購與薪酬相關問題。", "can": ["給出首選與備選專家，並附上佐證", "佐證來自 SharePoint、Teams、Outlook、行事曆與組織資料", "找出非主管職的隱藏高手", "辨識應用程式或網站的擁有者", "比較兩位專家，決定先找誰", "擬好可直接寄出的 Email 或 Teams 訊息", "整理會前談話重點，也能協助尋找導師", "不處理人資、法務、併購與薪酬"], "who": "新進人員、跨部門合作者，以及在大組織裡找不到人問的每一個人。", "prompts": ["公司裡誰最懂這個產品的技術架構？請附上判斷依據。", "這個應用程式現在是誰在負責？", "這兩位專家我該先找誰？"], "status": "Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Find the most credible experts inside your company.", "lead": "Finds the most credible subject matter expert in your company for any topic, product, process or customer. It returns a top pick plus a backup, with cited evidence from SharePoint, Microsoft Teams, Outlook, Calendar and org data, along with an email or Teams message ready to send. It also surfaces hidden-gem experts outside leadership, identifies who owns an app or site, compares two experts so you know who to approach first, drafts pre-meeting talking points, and finds mentors. It does not handle HR, legal, M&A or compensation.", "can": ["Return a top pick and a backup, with cited evidence", "Evidence drawn from SharePoint, Teams, Outlook, Calendar and org data", "Surface hidden-gem experts outside leadership", "Identify who owns an app or a site", "Compare two experts so you know who to approach first", "Draft an email or Teams message ready to send", "Prepare pre-meeting talking points, and find mentors", "Does not handle HR, legal, M&A or compensation"], "who": "New joiners, cross-team collaborators and anyone lost in a large org.", "prompts": ["Who knows this product’s architecture best? Show me the evidence.", "Who owns this app now?", "Which of these two experts should I approach first?"], "sub": "SME Finder", "status": "Agent", "product": "Microsoft 365 Copilot"}, "n": 10, "file": "MS-10", "domain": "grow", "stop": 1, "prop": "people"}, {"id": "researcher", "name": "Researcher", "color": "#3e368c", "icon": "book", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_552e6eda-fc18-7fb9-0ef6-1bf2de3393e4", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/get-started-with-researcher-in-microsoft-365-copilot", "zh": {"sub": "研究工具", "tagline": "深度推理你的工作內容與網路資料，形成觀點並提出洞察。", "lead": "Researcher 以深度推理能力，通盤解讀你有權限的工作內容（檔案、郵件、會議、聊天）與網路上的資料，理解、推論之後形成觀點並提出洞察，而不只是把資料整理起來，等於讓每一位員工隨時都有專家級的分析可用。結論會標註引用來源，完成的研究報告還能直接輸出成 Word、PowerPoint、PDF、資訊圖表或語音。", "can": ["對複雜主題做多步驟的深度推理", "同時解讀你的工作內容與網路資料", "不只彙整，會形成明確的觀點與洞察", "結論附上引用來源", "報告可輸出成 Word、PowerPoint、PDF、資訊圖表或語音"], "who": "需要做市場研究、競品分析、提案前置作業與產業趨勢彙整的人。", "prompts": ["根據目前所有文件與會議紀錄，建立客戶 A 的 Account Plan，並補充最新市場資訊與競爭者動態。", "把剛剛的研究結果做成一份 PowerPoint，重點放在給主管看的結論。", "比較這兩個解決方案的優缺點，做成資訊圖表並標註每項結論的來源。"], "status": "推理型 Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Deep reasoning across your work and the web, with a point of view.", "lead": "Researcher uses deep reasoning to parse the entirety of your work context — files, email, meetings and chats — along with the web, then reasons through it to form a point of view and offer insights rather than simply summarising, putting expertise on demand in every employee's hands. Conclusions are cited, and the finished report can be delivered as a Word document, a PowerPoint deck, a PDF, an infographic or audio.", "can": ["Reason through complex topics in multiple steps", "Draw on both your work context and the web", "Goes beyond summarising — it forms a view and offers insight", "Cites the source behind each conclusion", "Delivers as Word, PowerPoint, PDF, an infographic or audio"], "who": "Anyone doing market research, competitive analysis or pre-sales preparation.", "prompts": ["Build an account plan for Customer A from all our existing documents and meeting notes, and add the latest market intelligence and competitor moves.", "Turn that research into a PowerPoint deck aimed at an executive audience.", "Compare these two solutions as an infographic, citing the source behind each point."], "sub": "Researcher", "status": "Reasoning agent", "product": "Microsoft 365 Copilot"}, "n": 11, "file": "MS-11", "domain": "insight", "stop": 3, "prop": "report"}, {"id": "analyst", "name": "Analyst", "color": "#6d4992", "icon": "chart", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_8cfc4e6f-267e-db15-c6e7-3fc47a54f61e", "docs": "https://support.microsoft.com/en-us/Microsoft-365-Copilot/get-started-with-analyst-in-microsoft-365-copilot", "zh": {"sub": "資料分析師", "tagline": "用問的就能分析資料，不必是資料分析師。", "lead": "Analyst 能對各種格式的檔案執行複雜、多步驟的資料分析與程式碼執行。你不必翻遍上千列資料，也不必把 Excel、CSV、資料庫等多個檔案手動整併；只要用白話問一個問題，它就會計算統計、找出趨勢與異常值，並回覆一份易讀的報告，可以包含圖表與表格。", "can": ["對各種格式的檔案做複雜、多步驟的分析", "執行程式碼處理任意資料集", "一次整併多個 Excel、CSV 與資料庫檔案", "計算統計、找出趨勢與異常值", "回覆易讀的報告，可含圖表與表格", "用白話問就好，不必懂分析方法"], "who": "手上有一堆資料檔、但沒時間也不想自己跑分析的人。", "prompts": ["比較各區域與各季的銷售資料，並指出主要趨勢。", "依客戶互動指標，找出表現最好的產品或服務。", "這幾個檔案幫我合起來看，有沒有明顯的異常值？"], "status": "推理型 Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Ask a question about your data — no analyst required.", "lead": "Analyst performs complex, multi-step data analysis and code execution over arbitrary datasets. You do not have to comb through thousands of rows, or consolidate Excel spreadsheets, CSV files and databases yourself — just ask a simple question and it calculates statistics, identifies trends and shows outliers, then returns a report in easy-to-read language that can include charts and tables.", "can": ["Complex, multi-step analysis over files in many formats", "Executes code across arbitrary datasets", "Consolidates multiple Excel, CSV and database files at once", "Calculates statistics, identifies trends and shows outliers", "Returns an easy-to-read report with charts and tables", "Ask in plain language — no analyst skills needed"], "who": "Anyone sitting on data files with no time, or no wish, to run the analysis themselves.", "prompts": ["Compare sales data by region and quarter and highlight key trends.", "Identify top-performing products or services based on customer engagement metrics.", "Consolidate these files and show me any clear outliers."], "sub": "Analyst", "status": "Reasoning agent", "product": "Microsoft 365 Copilot"}, "n": 12, "file": "MS-12", "domain": "insight", "stop": 2, "prop": "chart"}, {"id": "surveys", "name": "Surveys", "color": "#37766f", "icon": "poll", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_a64931a6-8080-b1e7-e057-8e775a24ed66&source=agentCenterDialog", "docs": "", "zh": {"sub": "問卷調查", "tagline": "從建立、發放到分析，一條龍處理問卷。", "lead": "Forms Agent 與 Microsoft Forms 及 Copilot 聊天搭配使用，把問卷流程從建立、發放到分析一路串起來。建立：描述一次就生成完整問卷，可以在聊天旁邊直接編輯，也可以轉到 Microsoft Forms 繼續。發放：透過 Email、Teams、QR code 或連結分享，並協助擬邀請文字、建議回收進度的檢查點。分析：彙整重點發現、指出趨勢與異常，並提出可以執行的後續建議。", "can": ["描述一次就生成完整問卷", "在聊天旁邊編輯，或轉到 Microsoft Forms 繼續", "建議改進、調整設定並直接套用", "以 Email、Teams、QR code 或連結發放", "協助擬邀請文字，並建議回收檢查點", "彙整重點、指出趨勢與異常", "提出可以執行的後續建議"], "who": "要做員工調查、活動回饋、客戶滿意度調查的人。", "prompts": ["幫我設計一份員工滿意度問卷，10 題以內，涵蓋工作、團隊與發展。", "這份問卷的結果有什麼值得注意的趨勢或異常？", "幫我把這份問卷發出去，並擬一段邀請文字。"], "status": "Agent", "product": "Microsoft Forms"}, "en": {"tagline": "Form creation, distribution and analysis, automated.", "lead": "Forms Agent works with Microsoft Forms and Microsoft 365 Copilot chat, streamlining the process end to end. Create: describe what you need and get a complete form in one step, editable side by side with your chat or in Microsoft Forms. Distribute: share by email, Microsoft Teams, QR code or a direct link, with help composing the invitation and checkpoints to keep collection on track. Analyze: it summarises key findings, surfaces trends and anomalies, and recommends actionable takeaways.", "can": ["Generate a complete form in one step", "Edit side by side with chat, or continue in Microsoft Forms", "Suggest improvements, adjust settings and apply changes", "Share by email, Teams, QR code or a direct link", "Compose invitations and suggest collection checkpoints", "Summarise key findings, trends and anomalies", "Recommend actionable takeaways"], "who": "Anyone running employee surveys, event feedback or satisfaction studies.", "prompts": ["Design an employee satisfaction survey, under 10 questions, covering work, team and growth.", "What trends or anomalies stand out in these responses?", "Share this form for me and draft the invitation."], "sub": "Surveys", "status": "Agent", "product": "Microsoft Forms"}, "n": 13, "file": "MS-13", "domain": "insight", "stop": 1, "prop": "poll"}, {"id": "workforce-insights-frontier", "name": "Workforce Insights", "color": "#377656", "icon": "pulse", "status": "frontier", "url": "https://m365.cloud.microsoft/chat/?titleId=P_cee13b52-3ca2-f561-866d-5f91fdbf6689&source=agentCenterDialog", "docs": "", "zh": {"sub": "人力洞察", "tagline": "即時掌握組織的人員、結構與技能。", "lead": "為主管與其代理人提供組織的即時全貌，可依角色、年資、地點、職能等屬性檢視，讓人力決策更快也更有依據。不論是規劃組織調整、追蹤招募趨勢，或找出改善組織體質的機會，只要問一句就能得到洞察。資料來自你租戶內的人員與組織資料；若已連接 Workday、SAP SuccessFactors 等 HCM 系統（透過 Microsoft 365 的 Organizational Data Ingestion 服務），可取得更完整可靠的屬性；若租戶只有 Entra ID 這類身分資料，洞察範圍與品質會受限。設計上符合 Microsoft 的隱私與治理標準。", "can": ["依角色、年資、地點、職能等屬性檢視組織", "規劃組織調整時先看清現況結構", "追蹤招募趨勢", "找出可以改善組織體質的地方", "問一句話就得到洞察", "連接 Workday、SAP SuccessFactors 等 HCM 系統可取得更完整的屬性", "僅有身分資料（如 Entra ID）時，洞察範圍與品質會受限"], "who": "主管，以及獲授權代表主管查看的人。", "prompts": ["依角色與年資，我的組織目前的人力分布如何？", "過去半年的招募趨勢如何？哪些職能成長最快？", "如果要做組織調整，目前結構上有哪些問題？"], "status": "Frontier 計畫 Agent", "product": "Viva Insights"}, "en": {"tagline": "Real-time insight into your people, structure and skills.", "lead": "Gives leaders and their delegates a real-time, comprehensive view of their organisation — across role, tenure, location, function and other attributes — for faster, better-informed workforce decisions. Whether you are planning a reorg, monitoring hiring trends or looking for ways to improve org hygiene, the insight comes from a single question. It draws on the people and organisational data in your Microsoft 365 tenant; with a connected HCM system such as Workday or SAP SuccessFactors, powered through Organizational Data Ingestion, the attributes are richer and more reliable. If your tenant has only identity data such as Entra ID, available insights may be limited or vary in quality. Built to align with Microsoft's privacy and governance standards.", "can": ["View the organisation by role, tenure, location and function", "See the current structure clearly before planning a reorg", "Monitor hiring trends", "Spot opportunities to improve org hygiene", "Surface the insight from a single question", "Richer attributes when Workday or SAP SuccessFactors is connected", "Limited or variable quality on identity data alone"], "who": "Leaders, and the delegates authorised to look on their behalf.", "prompts": ["What does my organisation look like by role and tenure?", "What are the hiring trends over the last six months, and which functions grew fastest?", "If we reorganise, what structural issues should I know about first?"], "sub": "Workforce Insights", "status": "Frontier program agent", "product": "Viva Insights"}, "n": 14, "file": "MS-14", "domain": "insight", "stop": 0, "prop": "network"}, {"id": "plan-my-day", "name": "Plan My Day", "color": "#8c8031", "icon": "sunrise", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_ba30b62a-2a65-5db1-5925-b1889ad225f8&source=agentCenterDialog", "docs": "https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/agent-template-plan-my-day", "zh": {"sub": "每日規劃", "tagline": "整理今天的會議、待辦、郵件與優先順序。", "lead": "把今天的會議、待辦事項與郵件整理成一份晨間簡報，並標出真正的優先順序，讓每天都能在資訊充分、準備妥當的狀態下開始。", "can": ["彙整今日會議、待辦與待回覆郵件", "標出今天真正的優先事項", "提醒需要提前準備的行程", "讓一天的開始有明確方向"], "who": "每天早上被行程與訊息淹沒、想先抓重點的人。", "prompts": ["幫我做今天的晨間簡報：重要會議、待回覆的事、三個優先。", "今天行程很滿，哪些會議是我可以不用參加的？", "明天有沒有需要提前準備的會議？"], "status": "Agent", "product": "Microsoft 365 Copilot"}, "en": {"tagline": "Today’s meetings, tasks, mail and priorities — sorted.", "lead": "Compiles today’s meetings, tasks and email into a morning briefing and surfaces what actually matters, so you start the day informed and prepared.", "can": ["Pull together meetings, tasks and replies owed", "Surface the real priorities for today", "Flag anything needing advance preparation", "Give the day a clear direction"], "who": "Anyone whose morning starts buried in invites and messages.", "prompts": ["Give me today’s brief: key meetings, replies owed, top three priorities.", "My day is packed — which meetings could I skip?", "Anything tomorrow I should prepare for in advance?"], "sub": "Plan My Day", "status": "Agent", "product": "Microsoft 365 Copilot"}, "n": 15, "file": "MS-15", "domain": "work", "stop": 0, "prop": "clock"}, {"id": "planner-agent", "name": "Planner Agent", "color": "#37763c", "icon": "board", "status": "ga", "url": "https://m365.cloud.microsoft/chat/?titleId=P_b2f25cb5-1ccd-b7ed-8a74-35d2b43e0130&source=agentCenterDialog", "docs": "", "zh": {"sub": "專案規劃", "tagline": "管理專案、追蹤任務、規劃工作。", "lead": "協助管理專案、追蹤任務進度並規劃工作安排，讓專案的推進狀況一目了然。", "can": ["建立與整理專案任務", "追蹤任務進度與負責人", "協助安排工作順序與時程", "掌握專案整體狀況"], "who": "專案經理、團隊負責人與需要管理多線任務的人。", "prompts": ["幫我把這個專案拆成任務，並排出先後順序。", "目前有哪些任務逾期或沒有負責人？", "依團隊目前的可用時間，幫我重排這個專案的時程。"], "status": "Agent", "product": "Microsoft Planner"}, "en": {"tagline": "Manage projects, track tasks, plan the work.", "lead": "Helps manage projects, track task progress and plan work, so the state of a project is visible at a glance.", "can": ["Create and organise project tasks", "Track progress and owners", "Sequence work and set timelines", "See the overall project picture"], "who": "Project managers, team leads and anyone juggling several workstreams.", "prompts": ["Break this project into tasks and put them in order.", "Which tasks are overdue or have no owner?", "Reschedule this project around the team’s available time."], "sub": "Planner Agent", "status": "Agent", "product": "Microsoft Planner"}, "n": 16, "file": "MS-16", "domain": "work", "stop": 2, "prop": "board"}, {"id": "workflows-frontier", "name": "Workflows", "color": "#738c31", "icon": "flow", "status": "frontier", "url": "https://m365.cloud.microsoft/chat/?titleId=P_91fe45e4-9413-b0e6-dad9-c855b4952367&source=agentCenterDialog", "doc nt 清單。", "幫我建一份追蹤清單，欄位包含項目、負責人、狀態與到期日。", "這份清單存到我的 OneDrive，不要放在小組網站。"], "status": "Frontier 計畫 Agent", "product": "SharePoint Online"}, "en": {"tagline": "Turn Copilot chat context into a SharePoint list.", "lead": "Makes list creation effortless: build a new list through multi-turn natural language conversation, and let it convert the structured content Copilot produces — tables, for example — straight into a SharePoint list. Choose whether to save to a SharePoint site or your personal OneDrive for Business, and draw on both enterprise and web data. Part of the Frontier program, so it is still evolving.", "can": ["Create a new list through multi-turn conversation", "Convert structured Copilot content such as tables into a list", "Save to a SharePoint site or your personal OneDrive for Business", "Build lists from both enterprise and web data"], "who": "Teams who need a discussion, or a pile of data, to become a manageable list.", "prompts": ["Turn the table we just built into a SharePoint list.", "Create a tracking list with item, owner, status and due date columns.", "Save this list to my OneDrive rather than the team site."], "sub": "SharePoint List Agent", "status": "Frontier program agent", "product": "SharePoint Online"}, "n": 18, "file": "MS-18", "domain": "work", "stop": 4, "prop": "list"}, {"id": "frontline-agent", "name": "Frontline Agent", "color": "#36738c", "icon": "helmet", "status": "preview", "url": "https://m365.cloud.microsoft/chat/?titleId=P_720226f2-da2b-b5c6-c0b9-4ff3405ad25e&source=agentCenterDialog", "docs": "", "zh": {"sub": "第一線人員助理", "tagline": "快速取得答案、找到檔案，掌握最新消息。", "lead": "為第一線工作者設計的助理，協助快速取得答案、找到重要檔案並掌握最新消息。適用於零售、製造、醫療與現場服務等步調快速的環境。查詢範圍僅限於你本身有權限的 SharePoint 網站、聊天與頻道。", "can": ["快速回答工作上的問題", "找出需要的檔案與文件", "掌握最新的公告與異動", "僅使用你有權限的 SharePoint 網站、聊天與頻道"], "who": "零售、製造、醫療與現場服務等第一線工作人員與現場主管。", "prompts": ["這台設備出現 E-42 錯誤代碼，標準處理流程是什麼？", "這週我這邊有什麼新的公告或異動？", "幫我找這份作業程序的最新版本。"], "status": "Agent", "product": "Microsoft 365 Frontline"}, "en": {"tagline": "Quick answers, the right files, and what has changed.", "lead": "A simple assistant for frontline workers: quick answers, the files that matter, and the latest updates. Built for fast-paced settings such as retail, manufacturing, healthcare and field services. It draws only on the SharePoint sites, chats and channels you already have access to.", "can": ["Answer on-the-job questions quickly", "Find the files and documents you need", "Keep up with announcements and changes", "Stays within the SharePoint sites, chats and channels you can access"], "who": "Frontline staff and supervisors in retail, manufacturing, healthcare and field services.", "prompts": ["This machine is showing error E-42 — what is the standard procedure?", "What is new for my site this week?", "Find me the latest version of this work instruction."], "sub": "Frontline Agent", "status": "Agent", "product": "Microsoft 365 Frontline"}, "n": 20, "file": "MS-20", "domain": "work", "stop": 3, "prop": "helmet"}];

/* Copy the agent's direct link. Same feedback as the prompt copy buttons:
   a toast at the bottom, plus a temporary label on the button itself. The
   button stays enabled so it can be pressed again. */
function cpLink(btn){
  var u=btn.getAttribute('data-u'); if(!u) return false;
  var lbl=t(), was=btn.getAttribute('data-label');
  if(was===null){ was=btn.textContent; btn.setAttribute('data-label', was); }
  function ok(){
    toast(lbl.linkCopied);
    btn.textContent=lbl.cpLinkDone; btn.classList.add('done');
    clearTimeout(btn._cpT);
    btn._cpT=setTimeout(function(){ btn.textContent=btn.getAttribute('data-label'); btn.classList.remove('done'); },1800);
  }
  function fb(){
    var ta=document.createElement('textarea');
    ta.value=u; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.top='-1000px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok() }catch(e){ toast(lbl.copyManual) }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(ok, fb);
  } else fb();
  return false;
}

/* ---- the spotlight: the announcement lights up the control it is describing ---- */
var spot=document.getElementById('spot'), spotSel=null, spotT=null;
/* the drawn part of a station, without the invisible tap target that makes the
   group twice as wide as anything the eye can see */
function spotBox(el){
  var hit=el.querySelector&&el.querySelector('.hit');
  if(!hit) return el.getBoundingClientRect();
  var b=null;
  Array.prototype.forEach.call(el.children,function(c){
    if(c===hit) return;
    var r=c.getBoundingClientRect();
    if(!r.width&&!r.height) return;
    b=b?{top:Math.min(b.top,r.top),left:Math.min(b.left,r.left),
         right:Math.max(b.right,r.right),bottom:Math.max(b.bottom,r.bottom)}
       :{top:r.top,left:r.left,right:r.right,bottom:r.bottom};
  });
  return b?{top:b.top,left:b.left,right:b.right,bottom:b.bottom,
            width:b.right-b.left,height:b.bottom-b.top}:el.getBoundingClientRect();
}
/* Everything below is measured from the conductor himself, not the panel, so folding

   while its toolbars are on screen */
function viewW(){ return (window.visualViewport&&visualViewport.width)||innerWidth }
function viewH(){ return (window.visualViewport&&visualViewport.height)||innerHeight }
function walkFig(){ return onboard.querySelector('.pa-spk').getBoundingClientRect() }
function walkPlace(px,py,instant){
  var pa=onboard.querySelector('.pa'), pb=pa.getBoundingClientRect(), sb=walkFig();
  if(instant) pa.style.transition='none';
  if(px!=null) pa.style.left=(px-(sb.left-pb.left))+'px';
  if(py!=null) pa.style.top=(py-(sb.top-pb.top))+'px';
  if(instant){ pa.getBoundingClientRect(); pa.style.removeProperty('transition') }

/* where he should stand to talk about a control without covering it */
function walkTarget(sel){
  var r=spotFind(sel); if(!r) return null;
  var fig=walkFig(), fw=fig.width||74, fh=fig.height||118;
  var vw=viewW(), vh=viewH();
  var m=Math.min(28,vw*0.03), wide=vw>680;
  var pw=Math.min(500,vw-28), h=Math.max(fh,walkBoxH);
  var box={top:r.top-17,bottom:r.top+r.height+17,left:r.left-17,right:r.left+r.width+17};
  var side=wide?'right':walkSide;
  if(wide){
    var gapR=vw-box.right, gapL=box.left;
    side=(gapR>=pw+m)?'right':((gapL>=pw+m)?'left':(gapR>=gapL?'right':'left'));
  }else{
    /* the panel spans the phone, so he just stands at the end nearer what he points at,
       and keeps his side when the control is centred rather than flip-flopping */
    var c=(box.left+box.right)/2;
    if(c<vw*0.4) side='left'; else if(c>vw*0.6) side='right';
  }

  var py=Math.min(Math.max(12,(box.top+box.bottom)/2-fh/2),Math.max(12,vh-fh-12));
  var l=px==null?0:(side==='left'?px:px+fw-pw), rEdge=l+pw;
  var pTop=py+fh-h;
  if((px==null||(rEdge>box.left&&l<box.right))&&pTop<box.bottom&&py+fh>box.top){
    if(box.top-14-fh>=12) py=box.top-14-fh;
    else if(box.bottom+14+fh<=vh-12) py=box.bottom+14;

function walkFace(side){

}
/* he leaves a fading stand-in behind and fades in at the new spot on the same beat */
var ghostT=null, stepT=null;
function walkHide(){                 /* out of sight with no fade, so nothing flashes first */
  var fig=onboard.querySelector('.pa-spk');
  fig.style.transition='none';
  onboard.classList.add('stepping');
  fig.getBoundingClientRect();
  fig.style.removeProperty('transition');
}
function walkStep(px,py,side,noGhost){
  var fig=onboard.querySelector('.pa-spk'), ghost=document.getElementById('crewGhost');
  var r=fig.getBoundingClientRect();
  if(ghostT){ clearTimeout(ghostT); ghostT=null }
  if(stepT){ clearTimeout(stepT); stepT=null }
  /* staying on the same side he simply walks up or down; only a change of side needs the swap */
  if(!noGhost&&side===walkSide){
    onboard.classList.add('sliding');
    walkPlace(px,py,false);
    stepT=setTimeout(function(){ stepT=null; onboard.classList.remove('sliding') },400);
    return;
  }
  onboard.classList.remove('sliding');
  if(!noGhost){
    ghost.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+
      r.height+'px;opacity:1;transition:none';
    ghost.classList.add('on');
    ghost.getBoundingClientRect();
    ghost.style.removeProperty('transition');
  }
  fig.style.transition='none';
  onboard.classList.add('stepping');
  fig.getBoundingClientRect();
  walkFace(side);
  walkPlace(px,py,true);
  fig.style.removeProperty('transition');
  stepT=setTimeout(function(){
    stepT=null;
    onboard.classList.remove('stepping');
    if(!noGhost) ghost.style.opacity='0';
    ghostT=setTimeout(function(){ ghostT=null; ghost.classList.remove('on') },420);
  },20);
}
function walkGhostOff(){
  if(ghostT){ clearTimeout(ghostT); ghostT=null }
  if(stepT){ clearTimeout(stepT); stepT=null }
  onboard.classList.remove('stepping');
  onboard.classList.remove('sliding');
  var ghost=document.getElementById('crewGhost');
  ghost.classList.remove('on'); ghost.style.opacity='0';
}
/* he says his line a character at a time; tags cost no time so any markup stays intact */
var typeT=null;
/* one sentence per line reads like speech rather than a paragraph */
function sayLines(s){
  var parts=s.match(/[^。！？!?]+[。！？!?]*/g)||[s];
  return parts.map(function(p){
    return '<span class="say-line">'+noteText(p.trim())+'</span>' }).join('');
}
function typeStop(el){
  if(typeT){ clearTimeout(typeT); typeT=null }
  if(el&&el.getAttribute('data-full')!==null){
    el.innerHTML=el.getAttribute('data-full');
    el.classList.remove('typing');
  }
}
function typeOut(el){
  var html=el.getAttribute('data-full')||el.innerHTML;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.innerHTML=html; return;
  }
  var parts=html.match(/<[^>]+>|&[a-zA-Z#0-9]+;|[\s\S]/g)||[];
  var out='', n=0;
  el.innerHTML='';
  el.classList.add('typing');
  (function step(){
    typeT=null;
    while(n<parts.length){
      var p=parts[n++]; out+=p;
      if(p.charAt(0)!=='<') break;
    }
    el.innerHTML=out;
    if(n<parts.length) typeT=setTimeout(step,32);
    else el.classList.remove('typing');

/* a note may name both the wide-screen control and its phone counterpart, and the
   first one actually on screen wins; a leading + lights every match at once. */
function spotFind(sel){
  var all=sel.charAt(0)==='+', list=(all?sel.slice(1):sel).split(','), first=null, b=null;
  for(var i=0;i<list.length;i++){
    var els=document.querySelectorAll(list[i].trim());
    for(var j=0;j<els.length;j++){
      var r=spotBox(els[j]);
      if(!r.width&&!r.height) continue;
      if(!first) first=els[j];
      b=b?{top:Math.min(b.top,r.top),left:Math.min(b.left,r.left),
           right:Math.max(b.right,r.right),bottom:Math.max(b.bottom,r.bottom)}
         :{top:r.top,left:r.left,right:r.right,bottom:r.bottom};
      if(!all) break;
    }
    if(b&&!all) break;
  }

            width:b.right-b.left,height:b.bottom-b.top}:null;

function spotOff(){
  spotSel=null;

  spot.classList.remove('hushed');

  if(!onboard.classList.contains('walking'))

/* a walkthrough step hands the pointer back to the page: the shade stops swallowing

var tryClick=null;
function tryOff(){
  spot.classList.remove('tap');

  document.removeEventListener('click',tryClick,true);

  onboard.classList.remove('trying');

function tryOn(sel,hit){

         'h'+(-(w-2*r))+'a'+r+' '+r+' 0 0 1 '+(-r)+' '+(-r)+
         'v'+(-(h-2*r))+'a'+r+' '+r+' 0 0 1 '+r+' '+(-r)+'Z';

function spotPlace(bring){
  var r=spotSel&&spotFind(spotSel);

  var pa=onboard.querySelector('.pa'), ph=pa.getBoundingClientRect().height||300;
  var sheet=Math.max(12,innerHeight-14-ph);
  var hd=document.querySelector('header');
  var hb=(hd?hd.getBoundingClientRect().height:0)+12;
  /* the bubble stands beside the highlight as long as both fit on screen together;
     when they cannot, it lies along the bottom and the control is parked above it */
  var lie=r.height+ph+90>innerHeight-hb;

function spotOn(sel,solo){

var obT=null;
function playNotes(){
  stopNotes();

  var bar=wrap.querySelector('.obbar');
  var back=document.getElementById('obBack'),next=document.getElementById('obNext');
  var notes=t().notes;
  if(!rows.length) return;
  var i=0;
  function go(n){
    i=Math.max(0,Math.min(n,rows.length-1));
    for(var k=0;k<rows.length;k++)
      rows[k].className='obrow'+(k===i?' on':(k===(i-1+rows.length)%rows.length?' out':''));
    /* the bar counts the five numbered steps only, so step 01 lights the first mark */
    for(var d=0;d<dots.length;d++)
      dots[d].className='obdot'+(+dots[d].getAttribute('data-i')===i?' on':'');
    bar.style.display=notes[i]&&notes[i][0]?'':'none';
    back.disabled=i===0;
    spotOn(notes[i]&&notes[i][4],notes[i]&&notes[i][5]);
  }
  back.onclick=function(){go(i-1)};
  /* past the last note the train manager steps in and makes the offer in person */
  next.onclick=function(){ if(i===rows.length-1) showCrew(); else go(i+1) };
  go(0);
}

var crewAsk=document.getElementById('crewAsk'), crewFab=document.getElementById('crewFab');

function showCrewFab(){

/* the run always starts on the map, so whatever was opened in the meantime is closed first */
function backToMap(){
  if(ov.classList.contains('open')) close();
  if(guide.classList.contains('open')) closeGuide();
  hideBrief();
  window.scrollTo(0,0);
}
function showCrew(){
  var T2=t();
  spotOff();
  backToMap();
  fadeCrewFab();
  onboard.classList.remove('on');
  document.getElementById('crewWho').textContent=T2.crewWho;
  document.getElementById('crewTitle').textContent=T2.askTitle;
  document.getElementById('crewBody').innerHTML=noteBody(T2.askBody);
  document.getElementById('crewYes').textContent=T2.obYes;
  document.getElementById('crewNo').textContent=T2.obNo;
  document.getElementById('crewClose').setAttribute('aria-label',T2.obNo);
  crewAsk.classList.add('on');
}
function hideCrew(){ crewAsk.classList.remove('on'); crewAsk.classList.remove('out') }
crewFab.onclick=function(){ showCrew() };
document.getElementById('crewYes').onclick=function(){
  crewAsk.classList.add('out');            /* he bows out here and steps in over there */
  onboard.classList.add('on');
  startWalk();
  setTimeout(hideCrew,240);
};
document.getElementById('crewNo').onclick=hideOnboard;
document.getElementById('crewClose').onclick=hideOnboard;

/* the hands-on run offered at the end: the reader clicks the real controls in order,
   first on the map and then inside the station card the first click opened */
var walkT=null, parkT=null;
function stopWalk(){
  if(walkT){ clearInterval(walkT); walkT=null }
  if(parkT){ clearTimeout(parkT); parkT=null }
  Array.prototype.forEach.call(document.querySelectorAll('#obSay .note-body'),typeStop);
  walkGhostOff();
  onboard.classList.remove('walking');
  onboard.classList.remove('observing');
  onboard.classList.remove('stepping');
  onboard.classList.remove('side-left');
  walkSide='right';
  spot.classList.remove('walking');
  onboard.classList.remove('crew');
}
function walkWait(sel,cb){          /* a step can only start once its control exists */
  if(walkT){ clearInterval(walkT); walkT=null }
  if(spotFind(sel)){ cb(); return }
  var n=0;
  walkT=setInterval(function(){
    if(spotFind(sel)||++n>50){ clearInterval(walkT); walkT=null; cb() }
  },120);
}
/* he waits out the screen change, then walks straight from where he stood to the
   place he will speak from next */
function walkPark(instant){
  if(!onboard.classList.contains('walking')) return;
  var fig=walkFig(), fw=fig.width||74, fh=fig.height||118;
  var vw=viewW(), vh=viewH(), m=Math.min(28,vw*0.03);
  walkPlace(vw>680?vw-m-fw:null,
    Math.max(12,vh-fh-Math.min(28,vh*0.03)),instant);
}
function startWalk(){
  var T2=t(), ws=T2.walk||[];
  if(!ws.length){ hideOnboard(); return }
  backToMap();
  hideCrewFab();
  onboard.classList.add('walking');
  spot.classList.add('walking');   /* the station card sits above the shade otherwise */
  onboard.classList.add('crew');
  document.getElementById('obWho').textContent=T2.crewWho;
  document.getElementById('obTitle').textContent=T2.walkTitle;
  document.getElementById('obSay').innerHTML=
    '<div class="obstage">'+ws.map(function(w,i){
      return '<div class="obrow'+(i===0?' on':'')+'" data-i="'+i+'">'+
        '<p><span class="note-body">'+sayLines(w[1])+'</span></p></div>' }).join('')+'</div>'+
    '<div class="obbar" aria-hidden="true">'+ws.map(function(_,i){
      return '<span class="obdot'+(i===0?' on':'')+'"><i></i></span>' }).join('')+'</div>'+
    '<div class="ob-actions"><button id="obBack" type="button" disabled></button>'+
      '<button id="obNext" type="button">'+esc(T2.obNext)+'</button></div>';
  var wrap=document.getElementById('obSay');
  var stage=wrap.querySelector('.obstage');
  var rows=wrap.querySelectorAll('.obrow'), dots=wrap.querySelectorAll('.obdot');
  var lines=wrap.querySelectorAll('.note-body');
  Array.prototype.forEach.call(lines,function(el){ el.setAttribute('data-full',el.innerHTML) });
  var next=document.getElementById('obNext'), i=0, firstPark=true;
  function go(n){
    if(n>=rows.length){ hideOnboard(); return }
    i=Math.max(0,n);
    for(var k=0;k<rows.length;k++){
      rows[k].className='obrow'+(k===i?' on':(k<i?' out':''));
      dots[k].className='obdot'+(k===i?' on':'');
    }
    var w=ws[i];
    next.textContent=(i===rows.length-1?T2.walkDone:T2.obNext);
    next.disabled=!!w[4];
    next.parentElement.style.display=w[4]?'none':'';
    var park=firstPark; firstPark=false;
    tryOff();
    Array.prototype.forEach.call(lines,typeStop);   /* the bubble is sized from the whole line */
    var say=rows[i].querySelector('p');             /* the row is stretched by the grid, the text is not */
    stage.style.height=Math.ceil(say.getBoundingClientRect().height)+'px';
    var fig=walkFig(), stood=park?null:{x:fig.left,y:fig.top};
    spotOff();
    onboard.classList.add('observing');
    if(stood) walkPlace(stood.x,stood.y,true);   /* folding the bubble must not shift him */
    else { walkHide(); walkPark(true) }
    function arrive(){
      walkWait(w[2],function(){
        spot.classList.add('hushed');
        spotOn(w[2],null);
        walkT=setTimeout(function(){        /* the card settles before he changes places */
          var t=walkTarget(w[2]);
          if(t) walkStep(t.px,t.py,t.side,park);
          else onboard.classList.remove('stepping');   /* no target found: he still shows up */
          walkT=setTimeout(speak,w[5]||0);
        },260);
      });
    }
    function speak(){
      walkT=null;
      var at=walkFig();
      spot.classList.remove('hushed');
      onboard.classList.remove('observing');
      walkPlace(at.left,at.top,true);            /* unfolding must not shift him either */
      walkBoxH=onboard.querySelector('.pa').getBoundingClientRect().height||walkBoxH;
      typeOut(rows[i].querySelector('.note-body'));
      if(w[3]) tryOn(w[3],function(){ go(i+1) });
    }
    if(park) arrive();
    else walkT=setTimeout(function(){ walkT=null; arrive() },380);
  }
  next.onclick=function(){ go(i+1) };
  go(0);
}

function positionAnnouncements(){
  var trigger=document.getElementById('obOpen').getBoundingClientRect();
  var top=Math.max(12,Math.round(trigger.top))+'px';
  var left=Math.round(trigger.left)+'px';
  brief.style.setProperty('--announcement-top',top);
  brief.style.setProperty('--announcement-left',left);
  onboard.style.setProperty('--announcement-top',top);
  onboard.style.setProperty('--announcement-left',left);
  guide.style.setProperty('--announcement-top',top);
  guide.style.setProperty('--announcement-left',left);
}
function showOnboard(){
  positionAnnouncements(); hideCrewFab(); renderOnboard(); onboard.classList.add('on')
}
function hideOnboard(){ onboard.classList.remove('on'); hideCrew(); stopNotes(); showCrewFab() }
document.getElementById('obClose').onclick=hideOnboard;

function showBrief(){ positionAnnouncements(); brief.classList.add('on'); renderBrief() }
function hideBrief(){ brief.classList.remove('on'); stopBrief() }
/* the guided announcement plays itself once; after that the megaphone is the way back in */
function firstRide(){ try{ return !localStorage.getItem('agentTransitOnboarded') }catch(e){ return true } }
function toMap(){
  hideBrief();
  var first=firstRide();
  if(first){
    setTimeout(showOnboard, 1150);     /* let the map settle before the notes play */
    try{ localStorage.setItem('agentTransitOnboarded','1') }catch(e){}
  }
  inside=true; departing=false;
  cover.classList.add('gone');
  app.classList.add('in');
  document.body.classList.remove('locked');
  if(!first) setTimeout(function(){   /* the map arrives first, the conductor follows */
    if(!onboard.classList.contains('on')&&!crewAsk.classList.contains('on')) showCrewFab();
  },900);
}

 for that skill, shallow to deep:", "b": [["01", "Foundations — vocabulary, enough to follow a conversation"], ["02", "Practice — three short exercises, end to end"], ["03", "Application — apply it to something real; getting stuck is the point"], ["04", "Advanced — only after the above, or you are just copying steps"]], "note": "Where do you want to start?"}}], "prompt-coach": [{"k": "doc", "zh": {"lead": "原本的提問太開放，我改寫成這樣：", "b": [["原句", "「幫我整理會議紀錄」"], ["改寫後", "「把這份逐字稿整理成三段：決議、待辦（含負責人）、待確認。每段最多 5 點，用條列。」"], ["差在哪", "指定了結構、數量與必要欄位，也說了要什麼格式。"], ["為什麼有效", "AI 不用猜你要什麼，猜錯的空間變小，重寫的次數就少了。"]], "note": "要我說明為什麼這樣改，之後你自己也寫得出來嗎？"}, "en": {"lead": "The original was too open — here is the rewrite:", "b": [["Before", "“Summarise my meeting notes.”"], ["After", "“Turn this transcript into three sections: decisions, actions with owners, open questions. Five bullets max per section.”"], ["What changed", "Structure, quantity, required fields and format are all specified."], ["Why it works", "Nothing is left to guess, so there is far less to redo."]], "note": "Want me to explain why it works, so you can write the next one yourself?"}}, {"k": "steps", "zh": {"lead": "一個通用的提示結構，四個部分：", "b": [["01", "角色 — 你要它用什麼身分、什麼專業來回答"], ["02", "任務 — 具體要它做什麼，用動詞開頭"], ["03", "限制 — 長度、格式、語氣，以及要避開什麼"], ["04", "素材 — 附上檔案或直接貼上內容"]], "note": "給我一個你的實際情境，我示範套一次。"}, "en": {"lead": "A general structure, in four parts:", "b": [["01", "Role — the perspective and expertise it should answer from"], ["02", "Task — what to do, stated as a verb"], ["03", "Constraints — length, format, tone, and what to avoid"], ["04", "Material — attach the file or paste the content"]], "note": "Give me a real scenario and I will demonstrate."}}, {"k": "doc", "zh": {"lead": "這個情境的提示，我直接寫好了：", "b": [["提示本體", "「你是負責季度回顧的專案負責人。請把附件的專案紀錄整理成一頁摘要，分成進度、風險與下季重點三段，每段最多四行，語氣中性。」"], ["為什麼這樣寫", "先給角色與素材，再給結構與長度，最後才是語氣。"], ["可以微調的地方", "把「一頁」換成實際頁數，或把三段換成你要的段落。"]], "note": "要我再寫一個給主管看的版本嗎？"}, "en": {"lead": "Here is the prompt for that:", "b": [["The prompt", "“You are the project lead running our quarterly review. Turn the attached project notes into a one-page summary in three sections — progress, risks, next quarter — four lines each, in a neutral tone.”"], ["Why it is written this way", "Role and material first, then structure and length, tone last."], ["What to adjust", "Swap “one page” for a real length, or change the three sections."]], "note": "Want a version aimed at your manager?"}}], "writing-coach": [{"k": "table", "zh": {"lead": "這封信整體清楚，有三處可以再好：", "b": {"cols": ["位置", "問題", "建議"], "rows": [["第二段", "「請務必」語氣偏強硬", "改成「再麻煩你」"], ["第三段", "兩句在講同一件事", "刪掉後面那句"], ["整體結構", "要對方做的事放太後面", "移到第一段"]]}, "note": "其餘讀起來很順。要我直接改一版給你對照嗎？"}, "en": {"lead": "The email works overall — three things could be better:", "b": {"cols": ["Where", "Issue", "Suggestion"], "rows": [["Paragraph 2", "“You must” reads sharp", "Soften to “could you”"], ["Paragraph 3", "Two sentences, one point", "Cut the second"], ["Structure", "The ask sits too low", "Move it to the opening"]]}, "note": "The rest reads well. Want a revised version to compare?"}}, {"k": "doc", "zh": {"lead": "已改寫成更精簡的版本：", "b": [["改寫後開頭", "「想請你在週五前確認附件的第 2 節，確認後我就送出。」"], ["長度", "大約是原本的一半。"], ["做了什麼", "要求前置、被動改主動、刪掉重複的客套。"], ["保留了什麼", "你原本的禮貌用語都留著，沒有變得生硬。"]], "note": "如果覺得太直接，我可以再調柔一點。"}, "en": {"lead": "Rewritten, tighter:", "b": [["New opening", "“Could you confirm section 2 of the attachment by Friday? I will submit once you have.”"], ["Length", "About half the original."], ["What changed", "The ask leads, passive became active, repeated courtesies cut."], ["What stayed", "Your politeness is intact — it does not read blunt."]], "note": "If it now feels too direct, I can soften it."}}, {"k": "list", "zh": {"lead": "開頭這段的結構，三個回饋：", "b": ["第一句就要讓讀者知道這份白皮書要解決什麼問題，目前放在第三句", "第二段同時講背景和方法，建議拆開，讀者一次只能接收一件事", "結尾缺一句承接，讀者不知道下一節要看什麼"], "note": "整體論述是完整的。要我照這三點改一版開頭給你對照嗎？"}, "en": {"lead": "Three notes on the opening:", "b": ["The problem you are solving should land in se
