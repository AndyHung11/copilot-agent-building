/* Runs the mock conversation: pick a prompt, watch it "send", then a
   simulated answer appears. Everything here is an illustration of the SHAPE
   of a reply — no real data is involved.                                 */
var chatT=[];
function playComic(){
  stopComic();
  var wrap=document.getElementById('chat'); if(!wrap) return;
  var body=document.getElementById('chBody');
  var id=wrap.getAttribute('data-id'), a=null;
  for(var k=0;k<AGENTS.length;k++) if(AGENTS[k].id===id) a=AGENTS[k];
  if(!a) return;
  var col=LC[a.domain], d=D(a), T2=t();
  Array.prototype.forEach.call(wrap.querySelectorAll('.ch-opt'),function(b){
    b.onclick=function(){ run(+b.getAttribute('data-i')) };
  });
  function said(txt){ return '<div class="ch-you">'+esc(txt)+'</div>' }
  function typing(){ return '<div class="ch-typing"><i></i><i></i><i></i></div>' }
  function answer(lead,inner,note){
    if(a.teamsMeeting) return '<div class="tm-result"><p class="ch-lead">'+esc(lead)+'</p>'+inner+
      (note?'<p class="ch-note">'+esc(note)+'</p>':'')+'</div>';
    return '<div class="ch-reply">'+
      '<div class="ch-av" style="background:'+col+'">'+svg(a.icon,13,'#fff')+'</div>'+
      '<div class="ch-msg"><p class="ch-lead">'+esc(lead)+'</p>'+inner+
        (note?'<p class="ch-note">'+esc(note)+'</p>':'')+
      '</div></div>';
  }
  function foot(i){
    if(a.setupGuide) return '<div class="ch-foot">'+
      '<span class="ch-sim">'+esc(T2.setupNote)+'</span>'+
      '<button class="ch-again">'+esc(T2.setupAgain)+'</button></div>';
    if(a.teamsMeeting) return '<div class="ch-foot">'+
      '<span class="ch-sim">'+esc(T2.demoNote)+'</span>'+
      '<button class="ch-again">'+esc(T2.demoAgain)+'</button></div>';
    return '<div class="ch-foot">'+
      '<span class="ch-sim">'+esc(T2.chatSim)+'</span>'+
      '<button class="cp" data-c="'+esc(d.prompts[i])+'">'+esc(T2.copyPrompt)+'</button>'+
      '<button class="ch-again">'+esc(T2.chatAgain)+'</button></div>';
  }
  function bindEnd(){
    var again=body.querySelector('.ch-again');
    if(again) again.onclick=function(){ reset() };
    bindCopy(body);
  }
  /* the card is what scrolls, and scrollIntoView is unreliable inside it on iOS, so the
     newest message is brought to the top of the card by hand */
  function chatTo(sel){
    var all=body.querySelectorAll(sel), el=all[all.length-1]||body.lastElementChild;
    if(!el) return;
    var max=Math.max(0,card.scrollHeight-card.clientHeight);
    var to=card.scrollTop+(el.getBoundingClientRect().top-card.getBoundingClientRect().top)-12;
    card.scrollTop=Math.max(0,Math.min(to,max));
  }
  /* one tap plays the whole exchange: the reply, then the follow-up asked and answered */
  function run(i){
    var rep=(REPLY[a.id]||[])[i]; if(!rep) return;
    if(a.teamsMeeting){
      var guide=rep[st.lang]||rep.zh;
      body.innerHTML=answer(guide.lead,replyBody({k:rep.k,b:guide.b}),guide.note)+foot(i);
      bindEnd(); chatTo('.tm-result'); return;
    }
    var r=rep[st.lang]||rep.zh, one=said(d.prompts[i]);
    body.innerHTML=one+typing();
    chatTo('.ch-you');
    chatT.push(setTimeout(function(){
      one+=answer(r.lead,replyBody({k:rep.k, b:r.b}),r.note);
      var fu=(FOLLOW[a.id]||[])[i], f=fu&&(fu[st.lang]||fu.zh);
      if(!f){ body.innerHTML=one+foot(i); bindEnd(); chatTo('.ch-reply'); return }
      body.innerHTML=one;
      chatTo('.ch-reply');
      chatT.push(setTimeout(function(){
        var two=one+said(f.q);
        body.innerHTML=two+typing();
        chatTo('.ch-you');
        chatT.push(setTimeout(function(){
          body.innerHTML=two+answer(f.lead,replyBody({k:fu.k, b:f.b}),'')+foot(i);
          bindEnd();
          chatTo('.ch-reply');
        }, 800));
      }, 1100));
    }, 900));
  }
  function reset(){
    var ask=a.setupGuide?T2.setupAsk:(a.teamsMeeting?T2.meetingAsk:T2.chatAsk),
        pick=a.setupGuide?T2.setupPick:(a.teamsMeeting?T2.demoPick:T2.chatPick);
    body.innerHTML='<div class="ch-ask">'+esc(ask)+'</div>'+
      '<div class="ch-opts">'+d.prompts.map(function(p,i){
         var optionPick=pick;
        return '<button class="ch-opt" data-i="'+i+'"><span class="ch-q">'+esc(p)+'</span>'+
           '<span class="ch-go" style="color:'+col+'">'+esc(optionPick)+'</span></button>'
      }).join('')+'</div>';
    Array.prototype.forEach.call(body.querySelectorAll('.ch-opt'),function(b){
      b.onclick=function(){ run(+b.getAttribute('data-i')) };
    });
  }
}

var imageZoom=document.getElementById('imageZoom'),imageZoomImage=document.getElementById('imageZoomImage');
function openImageZoom(img){
  imageZoomImage.src=img.src;
  imageZoomImage.alt=img.alt;
  imageZoom.classList.add('open');
}
function closeImageZoom(){imageZoom.classList.remove('open')}
Array.prototype.forEach.call(guide.querySelectorAll('.guide-shot'),function(shot){
  function open(){openImageZoom(shot.querySelector('img'))}
  shot.onclick=open;
  shot.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};
});
document.getElementById('imageZoomClose').onclick=closeImageZoom;
imageZoom.onclick=function(e){if(e.target===imageZoom)closeImageZoom()};
function renderGuide(){var T2=t();
  ['guideKicker','guideTitle','guideLoginH','guideLoginP','guideDirectH','guideDirectP','guideAddH','guideAddP'].forEach(function(k){
    document.getElementById(k).textContent=T2[k]});
  document.getElementById('guideClose').setAttribute('aria-label',T2.guideClose);
  document.getElementById('guideDirectImage').alt=T2.guideDirectH;
  document.getElementById('guideAddImage').alt=T2.guideAddH;
  document.getElementById('guideSkipLabel').textContent=T2.guideSkip;
  document.getElementById('guideSkip').checked=skipGuide;
  guide.querySelectorAll('.guide-shot')[0].setAttribute('aria-label',T2.guideDirectH);
  guide.querySelectorAll('.guide-shot')[1].setAttribute('aria-label',T2.guideAddH);
  document.getElementById('guideBack').textContent=T2.guideBack;
  showGuideStep(0);
}
function showGuideStep(n){
  var steps=guide.querySelectorAll('.guide-step'),dots=guide.querySelectorAll('.guide-dot');
  guideStep=Math.max(0,Math.min(n,steps.length-1));
  for(var i=0;i<steps.length;i++){
    steps[i].classList.toggle('on',i===guideStep);
    dots[i].classList.toggle('on',i===guideStep);
  }
  var guideGo=document.getElementById('guideGo');
  document.getElementById('guideBack').hidden=guideStep===0;
  document.getElementById('guideSkipWrap').hidden=guideStep!==steps.length-1;
  guideGo.classList.toggle('next',guideStep<steps.length-1);
  guideGo.textContent=guideStep===steps.length-1?t().guideGo:t().guideNext;
  document.querySelector('.guide-panel').scrollTop=0;
}
function guideAgent(el){
  if(skipGuide)return true;
  guideUrl=el.href;positionAnnouncements();renderGuide();guide.classList.add('open');return false;
}
function closeGuide(){guide.classList.remove('open');guideUrl=''}
function continueGuide(){
  if(guideStep<2){showGuideStep(guideStep+1);return}
  if(guideUrl)window.location.href=guideUrl;
}
document.getElementById('guideClose').onclick=closeGuide;
document.getElementById('guideBack').onclick=function(){showGuideStep(guideStep-1)};
document.getElementById('guideGo').onclick=continueGuide;
document.getElementById('guideSkip').onchange=function(){skipGuide=this.checked};
Array.prototype.forEach.call(guide.querySelectorAll('.guide-dot'),function(dot){
  dot.onclick=function(){showGuideStep(+dot.getAttribute('data-i'))};
});
guide.addEventListener('click',function(e){if(e.target===guide)closeGuide()});
function apply(){var T2=t();
  document.documentElement.lang=st.lang==='zh'?'zh-Hant':'en';
  ['cvt','cta','h1','lede'].forEach(function(k){document.getElementById(k).textContent=T2[k]});
  document.getElementById('replayHint').textContent=T2.replayHint;
  document.getElementById('replayHintMobile').textContent=T2.replayHintMobile;
  var cvs=document.getElementById('cvs');cvs.textContent=T2.cvs;
  if(T2.cvsScene){var scene=document.createElement('span');scene.className='scene-line';scene.textContent=T2.cvsScene;cvs.appendChild(scene)}
  document.getElementById('destTxt').textContent=T2.dest;
  document.getElementById('bName').textContent=T2.brand;
  document.getElementById('back').textContent=T2.back;
  document.getElementById('obOpen').setAttribute('aria-label',T2.obOpen);
  document.getElementById('obOpen').title=T2.obOpen;
  document.getElementById('obOpen').setAttribute('data-label',T2.obOpen);
  document.getElementById('q').placeholder=T2.qph;
  document.getElementById('qclear').setAttribute('aria-label',T2.clearQ);
  document.getElementById('qclear').title=T2.clearQ;
  document.getElementById('bfSkip').textContent=T2.briefSkip;
  document.getElementById('toTop').textContent=T2.toTop;
  document.getElementById('foot').textContent=T2.foot;
  document.getElementById('footh').textContent=T2.footH;
  document.getElementById('mkey').innerHTML=
    '<span><svg width="24" height="24"><circle cx="12" cy="12" r="10.5" style="fill:#fff;stroke:#616b78;stroke-width:1.6"/><circle cx="12" cy="12" r="7" style="fill:#fff;stroke:#616b78;stroke-width:3"/></svg>'+esc(T2.mk[0])+'</span>'+
    '<span><svg width="24" height="24"><circle cx="12" cy="12" r="8.5" style="fill:#616b78"/></svg>'+esc(T2.mk[1])+'</span>'+
    '<span><svg width="24" height="24"><circle cx="12" cy="12" r="7" pathLength="100" style="fill:#fff;stroke:#616b78;stroke-width:2.5;stroke-dasharray:6 4"/></svg>'+esc(T2.mk[2])+'</span>';
  document.getElementById('crewFabTip').textContent=T2.askTitle;
  crewFab.setAttribute('aria-label',T2.crewWho+' — '+T2.askTitle);
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){b.classList.toggle('on',b.dataset.lang===st.lang)});
  try{localStorage.setItem('agentTransitLang',st.lang)}catch(e){}
  renderKey(); renderMap();
  if(ov.classList.contains('open')&&cur)draw(cur.L,cur.i);
  if(guide.classList.contains('open'))renderGuide();
  if(onboard.classList.contains('on'))renderOnboard()}
var cover=document.getElementById('cover'),app=document.getElementById('app'),inside=false;
var gates=document.getElementById('gates');
var departing=false;
function enter(){
  if(inside||departing) return;
  showBrief();                 /* the announcement plays; the train waits */
}
/* only once the passenger chooses to go does the train pull away */
function depart(){
  if(departing||inside) return;
  hideBrief();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ toMap(); return }
  departing=true;
  gates.classList.add('on');                                        /* doors appear, still open */
  setTimeout(function(){ gates.classList.add('shut') }, 420);       /* then they close */
  setTimeout(function(){ cover.classList.add('leaving') }, 1180);   /* and the train pulls away */
  setTimeout(toMap, 2080);
}
function leave(){if(!inside)return;skipGuide=false;hideOnboard();if(ov.classList.contains('open'))close();inside=false;hideCrewFab();hideBrief();departing=false;
  cover.classList.remove('gone');app.classList.remove('in');document.body.classList.add('locked');
  gates.classList.remove('on','shut');
  setTimeout(function(){ cover.classList.remove('leaving') }, 30);
  window.scrollTo(0,0)}
document.getElementById('enter').onclick=enter;
document.getElementById('enter').addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();enter()}
});
/* the hint line reads as tappable, so the whole platform accepts the tap — not just the train */
cover.addEventListener('click',function(){if(!brief.classList.contains('on'))enter()});
document.getElementById('back').onclick=leave;
document.getElementById('obOpen').onclick=function(){ showOnboard() };
window.addEventListener('resize',function(){
  if(brief.classList.contains('on')&&briefAlign)briefAlign();
  if(spotSel)spotPlace();
  if(onboard.classList.contains('walking')){
    var t=spotSel&&walkTarget(spotSel);
    if(t){ walkFace(t.side); walkPlace(t.px,t.py,true) } else walkPark(true);
  }
});
/* the iOS toolbars slide away without firing a window resize */
if(window.visualViewport) visualViewport.addEventListener('resize',function(){
  if(!onboard.classList.contains('walking')) return;
  var t=spotSel&&walkTarget(spotSel);
  if(t){ walkFace(t.side); walkPlace(t.px,t.py,true) } else walkPark(true);
});
window.addEventListener('scroll',function(){ if(spotSel)spotPlace() },{passive:true});
document.getElementById('q').addEventListener('input',function(e){
  st.q=e.target.value;
  if(st.q.trim()&&st.line!=='all'){st.line='all';renderKey()}
  renderMap()
});
document.getElementById('q').addEventListener('focus',function(){qFocused=true;renderQTips()});
document.getElementById('q').addEventListener('blur',function(){qFocused=false;renderQTips()});
document.getElementById('qclear').addEventListener('mousedown',function(e){e.preventDefault()});
document.getElementById('qclear').addEventListener('click',function(){setQuery('')});
/* the announcement can always be skipped — the map is one tap away */
document.getElementById('bfSkip').addEventListener('click',function(e){e.stopPropagation();depart()});
/* on a phone the list is long: a quick way back to the search field */
var toTopBtn=document.getElementById('toTop');
toTopBtn.addEventListener('click',function(){
  window.scrollTo({top:0,behavior:'smooth'})
});
window.addEventListener('scroll',function(){
  toTopBtn.hidden=!(inside&&window.pageYOffset>360)
},{passive:true});
Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'),function(b){
  b.addEventListener('click',function(e){e.stopPropagation();st.lang=b.dataset.lang;apply()})});
ov.addEventListener('click',function(e){if(e.target===ov)close()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&imageZoom.classList.contains('open')){closeImageZoom();return}
  if(e.key==='Escape'&&guide.classList.contains('open')){closeGuide();return}
  if(!ov.classList.contains('open')){
    if(e.key==='Escape'&&onboard.classList.contains('on')){hideOnboard();return}
    if(e.key==='Escape'&&inside)leave();return}
  if(e.key==='Escape')close();
  if(e.key==='ArrowLeft'){var p=document.getElementById('pv');if(p&&!p.disabled)p.click()}
  if(e.key==='ArrowRight'){var n=document.getElementById('nx');if(n&&!n.disabled)n.click()}});
apply();
</script>
