<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>M365 Copilot Agent — 博覽會</title>
<style>
:root {
  --ink: #1c2333;
  --muted: #5c6577;
  --faint: #8a93a6;
  --line: rgba(20, 30, 55, 0.10);
  --line-strong: rgba(20, 30, 55, 0.18);
  --panel: rgba(255, 255, 255, 0.82);
  --panel-solid: #ffffff;
  --glass: rgba(255, 255, 255, 0.68);
  --accent: #0f6cbd;
  --shadow-lg: 0 20px 50px -18px rgba(28, 45, 90, 0.35);
  --shadow-sm: 0 2px 10px rgba(28, 45, 90, 0.08);
  --font: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: #dfeaf6; }

#stage { position: fixed; inset: 0; }
#three-canvas { position: absolute; inset: 0; display: block; touch-action: none; }
#overlay { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

/* ---------- Top bar ---------- */
#topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 14px; padding: 13px 20px;
  background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.7));
  backdrop-filter: blur(16px); border-bottom: 1px solid var(--line);
}
#brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
#brand .logo {
  width: 34px; height: 34px; flex: none; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: conic-gradient(from 205deg, #00b7c3, #0f6cbd, #8378de, #e3008c, #00b7c3);
  box-shadow: 0 4px 14px rgba(15,108,189,0.35);
}
#brand .logo svg { width: 19px; height: 19px; }
#brand .titles { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
#brand .t1 { font-weight: 700; font-size: 15.5px; letter-spacing: -0.2px; white-space: nowrap; }
#brand .t2 { font-size: 11px; color: var(--faint); letter-spacing: 0.4px; }
#hamburger { display: none; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line-strong);
  background: #fff; color: var(--ink); font-size: 16px; cursor: pointer; flex: none; }
#searchWrap { position: relative; flex: 1; max-width: 400px; margin-left: auto; }
#searchInput {
  width: 100%; padding: 10px 14px 10px 38px; border-radius: 11px; border: 1px solid var(--line-strong);
  background: #fff; color: var(--ink); font-size: 13.5px; outline: none; font-family: inherit;
  box-shadow: var(--shadow-sm);
}
#searchInput::placeholder { color: var(--faint); }
#searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,108,189,0.12); }
#searchWrap .sicon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 14px; pointer-events: none; }
#searchResults {
  position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg);
  max-height: 340px; overflow-y: auto; display: none; z-index: 30; padding: 5px;
}
#searchResults.show { display: block; }
.sr-item { padding: 9px 11px; cursor: pointer; border-radius: 8px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; }
.sr-item:hover { background: #f2f6fb; }
.sr-item .em { font-size: 17px; flex: none; }
.sr-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-item .zn { font-size: 10.5px; padding: 2px 8px; border-radius: 7px; color: #fff; flex: none; }
#homeBtn, #exteriorBtn {
  flex: none; padding: 9px 15px; border-radius: 11px; border: 1px solid var(--line-strong);
  background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm);
}
#homeBtn:hover, #exteriorBtn:hover { border-color: var(--accent); color: var(--accent); }
#langSeg { display: flex; gap: 2px; background: #eef1f6; border: 1px solid var(--line);
  border-radius: 10px; padding: 3px; flex: none; }
#langSeg button { background: none; border: 0; color: var(--faint); font-weight: 800;
  font-size: 12px; padding: 6px 11px; border-radius: 7px; cursor: pointer; transition: .15s; }
#langSeg button.on { background: var(--accent); color: #fff; }

/* ---------- Sidebar ---------- */
#sidebar {
  position: absolute; top: 62px; left: 0; bottom: 0; width: 256px; z-index: 15;
  background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.82));
  backdrop-filter: blur(16px); border-right: 1px solid var(--line);
  padding: 16px 13px; overflow-y: auto; transition: transform 0.28s ease;
}
#sidebar h3 { margin: 4px 6px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--faint); }
.zone-btn {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 11px; margin-bottom: 7px;
  border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: pointer;
  text-align: left; color: var(--ink); font-family: inherit; transition: 0.2s; box-shadow: var(--shadow-sm);
}
.zone-btn:hover { transform: translateX(2px); border-color: var(--line-strong); }
.zone-btn.active { border-color: currentColor; }
.zone-btn .ic { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none; color: #fff; }
.zone-btn .info { flex: 1; min-width: 0; }
.zone-btn .n1 { font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone-btn .n2 { font-size: 10.5px; color: var(--faint); }
.zone-btn .cnt { flex: none; font-size: 11.5px; font-weight: 700; color: var(--muted); background: #eef2f7; padding: 2px 9px; border-radius: 999px; }

#hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 15;
  background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 16px; font-size: 12px; color: var(--muted);
  display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow-sm);
}
#hint button { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 14px; }

/* ---------- 3D hover tooltip ---------- */
#tooltip {
  position: absolute; z-index: 12; pointer-events: none; transform: translate(-50%, -130%);
  background: var(--ink); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 11px;
  border-radius: 8px; white-space: nowrap; display: none; box-shadow: var(--shadow-lg);
}
#tooltip::after { content: ""; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
  border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 5px solid var(--ink); }

/* ---------- Pavilion hover panel (agent name list) ---------- */
#zoneHover {
  position: fixed; z-index: 14; pointer-events: auto; cursor: pointer; display: none;
  min-width: 268px; max-width: 460px;
  background: rgba(11,17,32,0.94); backdrop-filter: blur(14px);
  border: 1px solid rgba(120,160,255,0.22); border-left: 4px solid #4f7cff;
  border-radius: 16px; padding: 16px 18px 16px; box-shadow: 0 22px 54px rgba(0,0,0,0.55);
  color: #eaf2ff;
  animation: zhIn .32s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes zhIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
#zoneHover .zh-head { display: flex; align-items: center; gap: 12px; }
#zoneHover .zh-bar { width: 4px; align-self: stretch; border-radius: 3px; flex: 0 0 auto; min-height: 38px; }
#zoneHover .zh-title { flex: 1 1 auto; min-width: 0; }
#zoneHover .zh-name { font-size: 18px; font-weight: 800; line-height: 1.2; letter-spacing: .3px; }
#zoneHover .zh-en { font-size: 10.5px; color: #8fa4c8; font-weight: 700; letter-spacing: .10em;
  text-transform: uppercase; margin-top: 3px; }
#zoneHover .zh-cnt { font-size: 17px; font-weight: 800; flex: 0 0 auto;
  border: 1.5px solid; border-radius: 12px; padding: 5px 12px; line-height: 1; }
#zoneHover .zh-desc { font-size: 12px; color: #9db0d2; line-height: 1.55; margin: 11px 0 0; }
#zoneHover .zh-list { list-style: none; margin: 12px 0 0; padding: 12px 0 0; counter-reset: zh;
  border-top: 1px solid rgba(120,160,255,0.14); }
#zoneHover .zh-list.two { column-count: 2; column-gap: 22px; }
#zoneHover .zh-list li { counter-increment: zh; break-inside: avoid;
  font-size: 13px; font-weight: 600; color: #dfe8fa; line-height: 1.45;
  padding: 3px 0 3px 24px; position: relative; }
#zoneHover .zh-list li::before { content: counter(zh, decimal-leading-zero);
  position: absolute; left: 0; top: 3px; font-size: 10px; font-weight: 800;
  color: var(--zc, #6f9bff); opacity: .85; font-variant-numeric: tabular-nums; }
#zoneHover .zh-tip { margin-top: 13px; font-size: 11px; color: #8aa0c8; font-weight: 700;
  border-top: 1px solid rgba(120,160,255,0.14); padding-top: 10px; }
#zoneHover .zh-tip::after { content: " ▸"; }

/* ---------- Modal ---------- */
/* backdrop covers only the 3D stage (right of the sidebar, below the topbar)
   so the modal centers inside the VR view, not the whole window */
#modalBackdrop { position: fixed; top: 62px; right: 0; bottom: 0; left: 256px;
  background: rgba(20,30,55,0.32); backdrop-filter: blur(3px);
  z-index: 50; display: none; align-items: center; justify-content: center; padding: 24px; }
#modalBackdrop.show { display: flex; }
#modal {
  width: 100%; max-width: 720px; max-height: 84vh; overflow-y: auto; background: #fff;
  border-radius: 20px; box-shadow: var(--shadow-lg); padding: 26px 28px 30px; position: relative;
  margin: auto;
  animation: pop 0.32s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes pop { from { transform: translateY(14px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
#modalClose { position: absolute; top: 16px; right: 16px; width: 34px; height: 34px; border-radius: 10px;
  border: 1px solid var(--line); background: #f7f9fc; color: var(--muted); cursor: pointer; font-size: 16px; }
#modalClose:hover { color: var(--accent); border-color: var(--accent); }
.m-head { display: flex; align-items: flex-start; gap: 15px; padding-right: 40px; }
.m-emoji { width: 60px; height: 60px; border-radius: 17px; display: flex; align-items: center; justify-content: center;
  font-size: 32px; flex: none; overflow: hidden; line-height: 1; }
.m-cname { font-size: 21px; font-weight: 700; letter-spacing: -0.4px; }
.m-ename { font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.m-badges { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; }
.badge.zone { color: #fff; }
.badge.free { background: rgba(31,157,99,0.12); color: #178a55; }
.badge.req { background: rgba(224,150,0,0.14); color: #b3721c; }
.m-tagline { margin: 16px 0 2px; font-size: 15px; font-weight: 600; }
.m-section { margin-top: 20px; }
.m-section h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--faint); margin-bottom: 9px; }
.m-desc { font-size: 14px; line-height: 1.8; color: var(--muted); white-space: pre-line; }
.pain-list { display: flex; flex-direction: column; gap: 7px; }
.pain-item { font-size: 13px; padding: 10px 13px; border-radius: 10px; background: #f7f9fc; border: 1px solid var(--line); color: var(--muted); }
.step-list { counter-reset: step; list-style: none; display: flex; flex-direction: column; gap: 11px; }
.step-list li { counter-increment: step; position: relative; padding-left: 38px; font-size: 13.5px; line-height: 1.6; }
.step-list li::before { content: counter(step); position: absolute; left: 0; top: -1px; width: 26px; height: 26px;
  border-radius: 50%; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; }
.example-box { background: #f7f9fc; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  font-family: Consolas, "Courier New", monospace; font-size: 13px; white-space: pre-line; line-height: 1.7; position: relative; }
.copy-btn { position: absolute; top: 10px; right: 10px; font-size: 11px; padding: 5px 11px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: #fff; color: var(--muted); cursor: pointer; }
.copy-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- Modal tabs: 說明 / 模擬試跑 ---------- */
.m-tabs { display: flex; gap: 6px; margin: 18px 0 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.m-tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 13px;
  font-size: 13px; font-weight: 700; color: var(--faint); cursor: pointer; transition: .15s;
  white-space: nowrap; }
.m-tab:hover { color: var(--ink); }
.m-tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.m-pane { display: none; } .m-pane.on { display: block; }

/* newsletter (EDM) pane */
.edm-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; }
.edm-note { font-size: 12px; color: var(--faint); }
.edm-open { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent);
  text-decoration: none; border: 1px solid var(--line-strong); border-radius: 9px;
  padding: 6px 12px; white-space: nowrap; }
.edm-open:hover { border-color: var(--accent); background: rgba(79,124,255,.06); }
.edm-frame { width: 100%; height: 66vh; min-height: 380px; border: 1px solid var(--line);
  border-radius: 13px; background: #fff; display: block; }
/* the newsletter is a fixed 728px email layout — widen the shell so it never clips */
#modal.wide { max-width: 840px; }

/* rich card content on the run pane */
.m-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 13px; }
.m-meta-i { font-size: 11.5px; font-weight: 700; color: var(--muted);
  background: #f2f5fa; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.m-quick { margin-top: 14px; background: #fbfcfe; border: 1px solid var(--line);
  border-radius: 13px; padding: 13px 15px; }
.m-quick-h { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--faint); font-weight: 800; margin-bottom: 8px; }
.m-quick-i { font-size: 12.6px; color: var(--muted); line-height: 1.6; padding-left: 17px;
  position: relative; margin-bottom: 5px; }
.m-quick-i:last-child { margin-bottom: 0; }
.m-quick-i::before { content: "—"; position: absolute; left: 0; color: #b9c4d6; }

/* run panel */
.run-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 12px; }
.sim-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
  padding: 5px 11px; border-radius: 999px; background: rgba(224,150,0,.13); color: #a8701a;
  border: 1px solid rgba(224,150,0,.32); }
.run-btn { margin-left: auto; background: var(--accent); border: 0; color: #fff; font-weight: 700;
  padding: 8px 17px; border-radius: 10px; cursor: pointer; font-size: 13px; }
.run-btn:hover { filter: brightness(1.1); }
.stage { background: #f7f9fc; border: 1px solid var(--line); border-radius: 14px;
  padding: 15px; min-height: 240px; }
.s-msg { display: flex; gap: 9px; margin-bottom: 12px; opacity: 0; transform: translateY(6px);
  animation: sIn .36s ease forwards; }
/* user messages sit on the RIGHT, agent replies on the LEFT */
.s-msg.u { flex-direction: row-reverse; }
@keyframes sIn { to { opacity: 1; transform: none; } }
.s-av { width: 27px; height: 27px; border-radius: 9px; flex: none; display: flex;
  align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
.s-av.u { background: #8a93a6; }
.s-av.a { background: linear-gradient(135deg, #3d7bfd, #a35bff); }
.s-bub { background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 13px; font-size: 13.2px; line-height: 1.65; flex: 1; }
.s-msg.u .s-bub { background: rgba(79,124,255,.1); border-color: rgba(79,124,255,.28);
  flex: 0 1 auto; max-width: 78%; text-align: left; }
.s-step { display: flex; align-items: center; gap: 8px; color: var(--faint);
  font-size: 12.3px; padding: 5px 3px 5px 36px; opacity: 0; animation: sIn .3s ease forwards; }
.s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none;
  animation: sPulse 1.1s ease-in-out infinite; }
@keyframes sPulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
.s-step.done .s-dot { background: #1f9d63; animation: none; }

/* output artifact */
.art { border: 1px solid var(--line-strong); border-radius: 13px; padding: 14px 15px;
  background: #fff; }
.art h5 { margin: 0 0 11px; font-size: 13px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
.art h5 .k { font-size: 9.5px; font-weight: 800; padding: 3px 8px; border-radius: 11px;
  background: rgba(79,124,255,.13); color: var(--accent); letter-spacing: .05em; }
.art-rec { margin-top: 11px; padding-top: 10px; border-top: 1px dashed var(--line-strong);
  font-size: 12.6px; color: var(--muted); line-height: 1.65; }

/* SWOT */
.swot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .swot { grid-template-columns: 1fr; } }
.swq { border-radius: 11px; padding: 10px 12px; border: 1px solid; }
.swq .qt { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; margin-bottom: 6px; }
.swq ul { margin: 0; padding-left: 15px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.swq li { margin-bottom: 3px; }
.swq.s { background: rgba(31,157,99,.06); border-color: rgba(31,157,99,.26) } .swq.s .qt { color: #178a55 }
.swq.w { background: rgba(214,64,92,.05); border-color: rgba(214,64,92,.24) } .swq.w .qt { color: #c23a55 }
.swq.o { background: rgba(79,124,255,.05); border-color: rgba(79,124,255,.24) } .swq.o .qt { color: #3a63d8 }
.swq.t { background: rgba(224,150,0,.06); border-color: rgba(224,150,0,.26) } .swq.t .qt { color: #a8701a }

/* brief list */
.nb { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
.nb:last-child { border: 0; margin: 0; padding: 0; }
.nb .cat { font-size: 10.5px; color: var(--faint); font-weight: 700; margin-bottom: 3px; }
.nb .tx { font-size: 12.7px; line-height: 1.6; color: var(--muted); }
.lv { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 7px;
  border-radius: 10px; margin-right: 6px; vertical-align: 1px; }
.lv.m { background: rgba(214,64,92,.13); color: #c23a55 }
.lv.n { background: rgba(120,135,160,.14); color: #6b7a92 }

/* comparison table */
.art table { width: 100%; border-collapse: collapse; font-size: 12px; }
.art th { text-align: left; font-size: 10px; letter-spacing: .05em; color: var(--faint);
  padding: 6px 8px; border-bottom: 1px solid var(--line-strong); font-weight: 800; }
.art td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top;
  line-height: 1.5; color: var(--muted); }
.rk { font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
.rk.h { background: rgba(214,64,92,.13); color: #c23a55 }
.rk.m { background: rgba(224,150,0,.15); color: #a8701a }
.rk.l { background: rgba(31,157,99,.12); color: #178a55 }

/* generic structure skeleton (agents without authored sim) */
.skrow { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 9px;
  opacity: 0; animation: sIn .4s ease forwards; }
.skn { width: 24px; height: 24px; border-radius: 8px; background: rgba(79,124,255,.12);
  color: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; flex: none; }
.skb { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
.skb .t { font-weight: 700; font-size: 12.8px; margin-bottom: 4px; }
.skb .d { font-size: 12px; color: var(--muted); line-height: 1.55; }

.sim-foot { margin-top: 12px; font-size: 11.5px; color: #8a701a; background: rgba(224,150,0,.07);
  border: 1px solid rgba(224,150,0,.24); border-radius: 11px; padding: 10px 13px; line-height: 1.6; }

/* ---------- Loading ---------- */
#loading { position: fixed; inset: 0; z-index: 100; background: linear-gradient(180deg, #0a0f1c, #111a2e);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #b8c4d8; font-size: 14px; }
.spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(120,160,220,0.2); border-top-color: #5aa0ff; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Scene-transition fade ---------- */
#fade { position: fixed; inset: 0; z-index: 60; background: #070b14; opacity: 0; pointer-events: none;
  transition: opacity 0.42s ease; }
#fade.show { opacity: 1; }

/* ---------- Back-to-lobby button (only inside a department room) ---------- */
#backBtn { position: absolute; top: 74px; left: 18px; z-index: 22; display: none;
  padding: 10px 16px; border-radius: 11px; border: 1px solid rgba(255,255,255,0.18);
  background: rgba(16,24,42,0.82); backdrop-filter: blur(10px); color: #eaf2ff; font-size: 13.5px;
  font-weight: 600; cursor: pointer; font-family: var(--font); box-shadow: var(--shadow-lg); }
#backBtn:hover { border-color: #5aa0ff; color: #9cc4ff; }
#backBtn.show { display: block; }

/* ---------- Room card deck (agent selection inside a department) ---------- */
#roomDeck {
  position: absolute; z-index: 18; left: 50%; bottom: 0; transform: translate(-50%, 100%);
  width: min(1080px, calc(100% - 300px)); max-height: 54vh;
  background: linear-gradient(180deg, rgba(13,20,36,0.7), rgba(9,14,26,0.92));
  backdrop-filter: blur(18px); border: 1px solid rgba(120,160,220,0.22);
  border-bottom: none; border-radius: 20px 20px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
  padding: 18px 22px 22px; overflow: hidden; display: flex; flex-direction: column;
  transition: transform 0.5s cubic-bezier(0.16,1,0.3,1); pointer-events: auto;
}
#roomDeck.show { transform: translate(-50%, 0); }
.rd-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
.rd-title { display: flex; align-items: center; gap: 13px; }
.rd-ic { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
.rd-name { font-size: 20px; font-weight: 800; color: #eef4ff; letter-spacing: -0.3px; }
.rd-sub { font-size: 12px; color: #8ea0bd; letter-spacing: 0.5px; margin-top: 2px; }
.rd-desc { font-size: 13px; color: #aebbd4; line-height: 1.6; max-width: 460px; align-self: center; }
.rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; overflow-y: auto; padding: 2px 4px 4px; }
.rd-card {
  position: relative; border-radius: 14px; padding: 14px 14px 13px; cursor: pointer;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.09); transition: transform 0.2s, border-color 0.2s, background 0.2s;
}
.rd-card:hover { transform: translateY(-3px); border-color: var(--rc, #5aa0ff); background: rgba(255,255,255,0.08); }
.rd-card .rc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.rd-card .rc-em { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
.rd-card .rc-nm { font-size: 14.5px; font-weight: 700; color: #eef4ff; line-height: 1.25; }
.rd-card .rc-tl { font-size: 12px; line-height: 1.55; color: #9fb0cc; min-height: 37px; }
.rd-card .rc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; }
.rd-card .rc-pill { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: rgba(52,195,143,0.14); color: #67e0ac; }
.rd-card .rc-pill.req { background: rgba(226,150,47,0.16); color: #f0b465; }
.rd-card .rc-go { font-size: 11.5px; color: #7f8ba3; }
.rd-card:hover .rc-go { color: #cfe0ff; }

@media (max-width: 860px) {
  #sidebar { transform: translateX(-100%); width: 80vw; max-width: 300px; }
  #sidebar.open { transform: translateX(0); }
  #hamburger { display: block; }
  #searchWrap { max-width: none; }
  #brand .t2 { display: none; }
  #roomDeck { width: 100%; max-height: 66vh; border-radius: 18px 18px 0 0; }
  .rd-desc { display: none; }
  /* sidebar is off-canvas on mobile → let the modal use the full width */
  #modalBackdrop { left: 0; padding: 16px; }
  #modal { max-height: 88vh; padding: 22px 20px 26px; }
}
</style>
</head>
